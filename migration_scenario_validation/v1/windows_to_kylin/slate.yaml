# Scenario A: Windows / MSVC C++ -> Kylin V10 + GCC/CMake.
#
# Every task is a slice of a real upstream repository.  `prepare.sh` checks out
# the pinned commit, copies the target-platform implementation into the
# evaluator-only `gold/` tree, then removes it from the agent-visible `work/`.
# `windows_files` stays visible and is the reference the agent migrates from.
scenario: windows_to_kylin

defaults:
  scenario: windows_to_kylin
  fit: B
  counted: true
  source_kind: upstream-platform-port
  gold_kind: implementation
  tolerances: {}
  target:
    os: kylin-v10-sp3
    arch: x86_64
    toolchain: gcc-13.3
    cmake: "3.16.5"
  gates:
    build: "configure and build the task target on Kylin V10"
    api_removal:
      symbol_regex: "^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)"
      source_regex: "windows\\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\\b|CreateFile|WaitForSingleObject|RegOpenKey|CoCreateInstance"
      exclude_globs:
        - "**/*_WIN32*"
        - "**/*_win32*"
        - "**/*w32*"
        - "**/*W32*"
        - "**/*_windows.c"
        - "**/*_windows.h"
        - "**/win32/**"
        - "**/Win32/**"
        - "**/win/**"
        - "**/Windows/**"
        - "**/windows/**"
        - "**/projects/Windows/**"
        - "**/winbuild/**"
    behavior: "the task's selected upstream tests pass on Kylin"

tasks:
  # ------------------------------------------------------------------ L1 ---
  - id: l1_poco_thread
    level: L1
    domain: runtime
    difficulty: easy
    title: "POCO Thread: Win32 threads -> pthreads"
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/Thread_WIN32.cpp
        - Foundation/include/Poco/Thread_WIN32.h
      gold_files:
        - Foundation/src/Thread_POSIX.cpp
      test_files:
        - Foundation/testsuite/src/ThreadTest.cpp
    spec: |
      POCO's Foundation library is built from platform-suffixed sources selected
      by CMake.  On Kylin the POSIX backend has been removed; the public header
      `Poco/Thread.h` and the Win32 implementation `Thread_WIN32.cpp` are still
      present as the reference.

      Recreate `Foundation/src/Thread_POSIX.cpp` so that Poco::Thread provides
      the same contract through pthreads: start/join, tryJoin, wakeup after a
      timed join, current()/currentTid(), signal handlers, thread priorities,
      OS-assigned stack size, and clean TLS teardown.  Keep every public
      signature in `Poco/Thread.h` unchanged.
    prepare:
      remove:
        - Foundation/src/Thread_POSIX.cpp
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2"
      artifact: "{build}/lib/libPocoFoundation.a"
    hidden_tests:
      command: "cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx ThreadTest"
    gates:
      api_removal:
        source_dirs:
          - Foundation/src/Thread_POSIX.cpp
      behavior: "ThreadTest passes; no Win32 thread API remains"

  - id: l1_poco_shared_library
    level: L1
    domain: runtime
    difficulty: easy
    title: "POCO SharedLibrary: LoadLibrary -> dlopen"
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/SharedLibrary_WIN32U.cpp
        - Foundation/include/Poco/SharedLibrary_WIN32U.h
      gold_files:
        - Foundation/src/SharedLibrary_UNIX.cpp
      test_files:
        - Foundation/testsuite/src/SharedLibraryTest.cpp
    spec: |
      Recreate `Foundation/src/SharedLibrary_UNIX.cpp`: load/UNLOAD shared
      objects with dlopen/dlsym/dlclose, map Poco's Poco::SharedLibrary
      exceptions onto dlerror(), expose prefix/suffix helpers, and keep the
      symbol lookup semantics (missing symbol must throw
      Poco::SharedLibrary::SymbolNotFoundException, not return null).
    prepare:
      remove:
        - Foundation/src/SharedLibrary_UNIX.cpp
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2"
      artifact: "{build}/lib/libPocoFoundation.a"
    hidden_tests:
      command: "cd {build}/bin && LD_LIBRARY_PATH=\"$PWD:$LD_LIBRARY_PATH\" ./Foundation-testrunner -ignore {work}/cppignore.lnx SharedLibraryTest"
    gates:
      api_removal:
        source_dirs:
          - Foundation/src/SharedLibrary_UNIX.cpp
      behavior: "SharedLibraryTest passes; no LoadLibrary/GetProcAddress remains"

  - id: l1_poco_file
    level: L1
    domain: filesystem
    difficulty: medium
    title: "POCO File: Win32 file handles -> POSIX file descriptors"
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/File_WIN32U.cpp
        - Foundation/include/Poco/File_WIN32U.h
      gold_files:
        - Foundation/src/File_UNIX.cpp
      test_files:
        - Foundation/testsuite/src/FileTest.cpp
    spec: |
      Recreate `Foundation/src/File_UNIX.cpp`.  The Windows file uses
      CreateFileW and 64-bit file pointers; the POSIX version must use
      open/stat/lstat/mkdir/rmdir/rename/link/symlink/readlink/utime and keep
      the same Poco::File observable behaviour:
        - exists(), isFile(), isDirectory(), isLink(), canRead/canWrite
        - sizes, timestamps, permissions (mode bits mapping)
        - copyTo/moveTo across directories, symbolic and hard links
        - directory iteration and the usual ENOENT/EEXIST error mapping
    prepare:
      remove:
        - Foundation/src/File_UNIX.cpp
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2"
      artifact: "{build}/lib/libPocoFoundation.a"
    hidden_tests:
      command: "cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx FileTest"
    gates:
      api_removal:
        source_dirs:
          - Foundation/src/File_UNIX.cpp
      behavior: "FileTest passes; no Win32 file API remains"

  - id: l1_poco_path
    level: L1
    domain: filesystem
    difficulty: easy
    title: "POCO Path: Win32 path rules -> POSIX path rules"
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/Path_WIN32U.cpp
        - Foundation/include/Poco/Path_WIN32U.h
      gold_files:
        - Foundation/src/Path_UNIX.cpp
      test_files:
        - Foundation/testsuite/src/PathTest.cpp
    spec: |
      Recreate `Foundation/src/Path_UNIX.cpp`.  Path semantics are the trap:
      separators are '/', drive letters and UNC prefixes disappear, '~' is
      expanded from $HOME, case sensitivity changes, and the Windows
      MAX_PATH-based buffer logic must become dynamic.  Keep the Poco::Path API
      (parse, makeAbsolute, makeRelative, resolve, current, home, temp, list)
      and the expected error behaviour for malformed input.
    prepare:
      remove:
        - Foundation/src/Path_UNIX.cpp
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2"
      artifact: "{build}/lib/libPocoFoundation.a"
    hidden_tests:
      command: "cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx PathTest"
    gates:
      api_removal:
        source_dirs:
          - Foundation/src/Path_UNIX.cpp
      behavior: "PathTest passes with POSIX path semantics"

  - id: l1_poco_rwlock_semaphore
    level: L1
    domain: runtime
    difficulty: medium
    title: "POCO RWLock + Semaphore: Win32 primitives -> pthread primitives"
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/RWLock_WIN32.cpp
        - Foundation/src/Semaphore_WIN32.cpp
        - Foundation/include/Poco/RWLock_WIN32.h
        - Foundation/include/Poco/Semaphore_WIN32.h
      gold_files:
        - Foundation/src/RWLock_POSIX.cpp
        - Foundation/src/Semaphore_POSIX.cpp
      test_files:
        - Foundation/testsuite/src/RWLockTest.cpp
        - Foundation/testsuite/src/SemaphoreTest.cpp
    spec: |
      Recreate both POSIX backends.  RWLock must support read/write lock,
      tryReadLock/tryWriteLock, unlock and the timeout variants; Semaphore must
      support wait, tryWait, wait(timeout) and set, with EINTR retry loops.
      The Windows implementations use SRWLOCK and HANDLE-based semaphores;
      pthread_rwlock_t and sem_t are not drop-in equivalents:
        - pthread semaphores use unsigned counts and reject negative initial
          values that Poco accepts;
        - timed waits use CLOCK_REALTIME on Linux and must convert Poco's
          millisecond Timeout to an absolute timespec;
        - writer starvation policy differs, so do not "optimise" the upstream
          implementation away.
    prepare:
      remove:
        - Foundation/src/RWLock_POSIX.cpp
        - Foundation/src/Semaphore_POSIX.cpp
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2"
      artifact: "{build}/lib/libPocoFoundation.a"
    hidden_tests:
      command: "cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx RWLockTest SemaphoreTest"
    gates:
      api_removal:
        source_dirs:
          - Foundation/src/RWLock_POSIX.cpp
          - Foundation/src/Semaphore_POSIX.cpp
      behavior: "RWLockTest and SemaphoreTest pass"

  # ------------------------------------------------------------------ L2 ---
  - id: l2_libgit2_file
    level: L2
    domain: filesystem
    difficulty: medium
    title: "libgit2 file layer: Win32 mmap/realpath -> POSIX"
    source:
      repo: https://github.com/libgit2/libgit2.git
      commit: 36f7e21ad757a3dacc58cf7944329da6bc1d6e96
      tag: v1.8.1
      license: GPL-2.0-with-linking-exception
      windows_files:
        - src/util/win32/map.c
        - src/util/win32/path_w32.c
        - src/util/win32/posix_w32.c
      gold_files:
        - src/util/unix/map.c
        - src/util/unix/realpath.c
      test_files:
        - tests/util/filebuf.c
        - tests/util/ftruncate.c
        - tests/util/stat.c
        - tests/util/path/core.c
    spec: |
      libgit2 wraps the OS in p_* helpers.  The POSIX mmap and realpath
      implementations were removed while the Win32 versions
      (`src/util/win32/map.c`, `path_w32.c`, `posix_w32.c`) stay visible.

      Reimplement:
        - `git__page_size`, `git__mmap`, `git__munmap` on top of
          sysconf(_SC_PAGE_SIZE), mmap/munmap, with the same
          GIT_MMAP_* prot/flags mapping and GIT_ENOTFOUND/GIT_EINVAL errors;
        - `p_realpath` and `p_realpath_utf8` via realpath(3), including the
          non-existing-path fallback that libgit2 needs for clone targets.

      Tests selected from the util suite exercise file buffers, truncation,
      stat and path canonicalisation.
    prepare:
      remove:
        - src/util/unix/map.c
        - src/util/unix/realpath.c
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON -DBUILD_CLI=OFF -DUSE_SSH=OFF -DUSE_HTTPS=OFF -DUSE_BUNDLED_ZLIB=ON -DREGEX_BACKEND=builtin && cmake --build {build} -j2"
      artifact: "{build}/libgit2.a"
    hidden_tests:
      command: "cd {build} && ./util_tests -v -sfilebuf -sftruncate -sstat -spath::core"
    gates:
      api_removal:
        source_dirs:
          - src/util/unix/map.c
          - src/util/unix/realpath.c
      behavior: "selected util clar suites pass offline"

  - id: l2_libgit2_process
    level: L2
    domain: runtime
    difficulty: hard
    title: "libgit2 process/thread layer: Win32 process + pthread wrappers"
    source:
      repo: https://github.com/libgit2/libgit2.git
      commit: 36f7e21ad757a3dacc58cf7944329da6bc1d6e96
      tag: v1.8.1
      license: GPL-2.0-with-linking-exception
      windows_files:
        - src/util/win32/process.c
        - src/util/win32/thread.c
        - src/util/win32/thread.h
      gold_files:
        - src/util/unix/process.c
        - src/util/unix/pthread.h
        - src/util/unix/posix.h
      test_files:
        - tests/util/process/start.c
        - tests/libgit2/threads/basic.c
        - tests/libgit2/threads/tlsdata.c
    spec: |
      The POSIX process spawner and the pthread wrapper header were removed.
      Recreate `src/util/unix/process.c`, `pthread.h` and `posix.h` with the
      same interfaces the rest of libgit2 uses:
        - git__process_init / git__process_cleanup
        - git__spawn with the stdout/stderr redirection and environment
          hooks used by the process tests
        - thread, mutex, rwlock, cond and TLS wrappers including timed waits
          and the cleanup destructors
      The Win32 files remain as the behavioural reference; do not change the
      call sites under src/.
    prepare:
      remove:
        - src/util/unix/process.c
        - src/util/unix/pthread.h
        - src/util/unix/posix.h
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON -DBUILD_CLI=OFF -DUSE_SSH=OFF -DUSE_HTTPS=OFF -DUSE_BUNDLED_ZLIB=ON -DREGEX_BACKEND=builtin && cmake --build {build} -j2"
      artifact: "{build}/libgit2.a"
    hidden_tests:
      command: "cd {build} && ./util_tests -v -sprocess::start && ./libgit2_tests -v -sthreads::basic -sthreads::tlsdata"
    gates:
      api_removal:
        source_dirs:
          - src/util/unix/process.c
          - src/util/unix/pthread.h
          - src/util/unix/posix.h
      behavior: "process and thread clar suites pass offline"

  - id: l2_libarchive_read_disk
    level: L2
    domain: archives
    difficulty: hard
    title: "libarchive read_disk: Win32 traversal -> POSIX traversal"
    source:
      repo: https://github.com/libarchive/libarchive.git
      commit: 313aa1fa10b657de791e3202c168a6c833bc3543
      tag: v3.7.4
      license: BSD-2-Clause
      windows_files:
        - libarchive/archive_read_disk_windows.c
        - libarchive/archive_read_disk_private.h
      gold_files:
        - libarchive/archive_read_disk_posix.c
      test_files:
        - libarchive/test/test_read_disk.c
        - libarchive/test/test_read_disk_directory_traversals.c
        - libarchive/test/test_read_disk_entry_from_file.c
    spec: |
      `archive_read_disk_posix.c` was removed.  Reimplement the disk reader
      for Kylin while keeping `archive_read_disk_windows.c` as the reference
      and `archive_read_disk_private.h` unchanged:
        - ACL/xattr entry metadata (where supported), nlink, inode, device,
          symlink target and hardlink detection;
        - directory traversal with the documented visit order and the
          `descend`/`can_descend` callback contract;
        - sparse-file and file-type handling used by the write-disk tests.
      The selected tests are the upstream read-disk tests, which run entirely
      on local fixtures.
    prepare:
      remove:
        - libarchive/archive_read_disk_posix.c
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DENABLE_TEST=ON -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF && cmake --build {build} -j2"
      artifact: "{build}/libarchive/libarchive.a"
    hidden_tests:
      command: "mkdir -p {build}/test-run && cd {build}/test-run && ../bin/libarchive_test -r {work}/libarchive/test test_read_disk test_read_disk_directory_traversals test_read_disk_entry_from_file"
    gates:
      api_removal:
        source_dirs:
          - libarchive/archive_read_disk_posix.c
      behavior: "upstream read-disk tests pass"

  - id: l2_libarchive_write_disk
    level: L2
    domain: archives
    difficulty: hard
    title: "libarchive write_disk: Win32 restore -> POSIX restore"
    source:
      repo: https://github.com/libarchive/libarchive.git
      commit: 313aa1fa10b657de791e3202c168a6c833bc3543
      tag: v3.7.4
      license: BSD-2-Clause
      windows_files:
        - libarchive/archive_write_disk_windows.c
        - libarchive/archive_write_disk_private.h
      gold_files:
        - libarchive/archive_write_disk_posix.c
      test_files:
        - libarchive/test/test_write_disk.c
        - libarchive/test/test_write_disk_failures.c
        - libarchive/test/test_write_disk_perms.c
        - libarchive/test/test_write_disk_secure.c
        - libarchive/test/test_write_disk_hardlink.c
    spec: |
      `archive_write_disk_posix.c` was removed.  Reimplement restore-to-disk
      on Kylin, keeping the Win32 implementation as the reference:
        - mkdir/rename/link/symlink with overwrite, no-overwrite and
          secure-symlink policies;
        - mode bits, ownership where permitted, timestamps, ACL/xattr flags;
        - sparse file writing and hardlink bookkeeping;
        - the documented error mapping for EEXIST/EPERM/ENOTSUP and the
          `ARCHIVE_EXTRACT_*` flags.
    prepare:
      remove:
        - libarchive/archive_write_disk_posix.c
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DENABLE_TEST=ON -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF && cmake --build {build} -j2"
      artifact: "{build}/libarchive/libarchive.a"
    hidden_tests:
      command: "mkdir -p {build}/test-run && cd {build}/test-run && ../bin/libarchive_test -r {work}/libarchive/test test_write_disk test_write_disk_failures test_write_disk_perms test_write_disk_secure test_write_disk_hardlink"
    gates:
      api_removal:
        source_dirs:
          - libarchive/archive_write_disk_posix.c
      behavior: "upstream write-disk tests pass"

  - id: l2_curl_tls
    level: L2
    domain: networking
    difficulty: hard
    title: "curl TLS backend: Schannel/Win32 -> OpenSSL on Kylin"
    source:
      repo: https://github.com/curl/curl.git
      commit: 7161cb17c01dcff1dc5bf89a18437d9d729f1ecd
      tag: curl-8_5_0
      license: curl
      windows_files:
        - lib/vtls/schannel.c
        - lib/vtls/schannel_verify.c
        - lib/vtls/schannel.h
      gold_files:
        - lib/vtls/openssl.c
      test_files:
        - tests/data/test3000
        - tests/data/test3001
    spec: |
      The OpenSSL vtls backend was removed; the Schannel backend and the
      generic `vtls` interface stay visible.  Implement `lib/vtls/openssl.c`
      against the OpenSSL 3.x API:
        - the `Curl_ssl` backend vtable and version reporting;
