  # -------------------------------------------------------------- negative --
  - id: negative_win32_eventlog
    level: L3
    domain: negative
    difficulty: hard
    title: "Negative control: Windows Event Log channel has no equivalent"
    fit: C
    negative: true
    expected_api_removal: fail
    gold_kind: none
    source:
      repo: https://github.com/pocoproject/poco.git
      commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
      tag: poco-1.13.3-release
      license: BSL-1.0
      windows_files:
        - Foundation/src/EventLogChannel.cpp
        - Foundation/include/Poco/EventLogChannel.h
        - Foundation/src/pocomsg.mc
      gold_files: []
      test_files: []
    spec: |
      `Poco::EventLogChannel` writes to the Windows Event Log through
      ReportEvent, registers an event source in the registry and loads
      message-table resources compiled from `pocomsg.mc`.  Kylin has no
      Event Log service, no equivalent registry event-source registration and
      no message-table resource compiler.

      The correct outcome is an explicit non-portability report, not a stub
      that silently drops log records.  Write `work/PORTING_NOTES.md` that:
        - names the platform-only APIs and where they are used;
        - explains why syslog/journald is not a behaviour-preserving
          replacement (different record model, source registration, IDs);
        - states what a product team would have to redesign.
      The API-removal gate is expected to FAIL on this task; it is a control
      for "the agent fabricated a port".
    prepare:
      remove: []
    build:
      mode: none
      command: ""
    hidden_tests:
      command: "test -s {work}/PORTING_NOTES.md && grep -qiE 'event ?log|not portable|no (direct )?(linux|posix|kylin) equivalent' {work}/PORTING_NOTES.md"
    gates:
      build: "not applicable: the module cannot be built on Kylin"
      api_removal:
        expect_fail: true
        source_dirs:
          - Foundation/src/EventLogChannel.cpp
        symbol_regex: "^(ReportEvent|RegisterEventSource|DeregisterEventSource|OpenEventLog)"
        source_regex: "windows\\.h|ReportEvent|RegisterEventSource|HKEY_|RegCreateKey|pocomsg"
        exclude_globs: []
      behavior: "PORTING_NOTES.md documents the non-portability and no fake backend is added"