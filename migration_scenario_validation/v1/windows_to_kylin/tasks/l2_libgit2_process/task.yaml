scenario: windows_to_kylin
fit: B
counted: true
source_kind: upstream-platform-port
gold_kind: implementation
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: '3.16.5'
gates:
  build: configure and build the task target on Kylin V10
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - src/util/unix/process.c
    - src/util/unix/pthread.h
    - src/util/unix/posix.h
  behavior: process and thread clar suites pass offline
id: l2_libgit2_process
level: L2
domain: runtime
difficulty: hard
title: 'libgit2 process/thread layer: Win32 process + pthread wrappers'
source:
  repo: https://github.com/libgit2/libgit2.git
  commit: 36f7e21ad757a3dacc58cf7944329da6bc1d6e96
  tag: v1.8.1
  license: GPL-2.0-with-linking-exception
  windows_files:
  - src/util/win32/process.c
  - src/util/win32/thread.c
  - src/util/win32/thread.h
  gold_files:
  - src/util/unix/process.c
  - src/util/unix/pthread.h
  - src/util/unix/posix.h
  test_files:
  - tests/util/process/start.c
  - tests/libgit2/threads/basic.c
  - tests/libgit2/threads/tlsdata.c
spec: |
  The POSIX process spawner and the pthread wrapper header were removed.
  Recreate `src/util/unix/process.c`, `pthread.h` and `posix.h` with the
  same interfaces the rest of libgit2 uses:
    - git__process_init / git__process_cleanup
    - git__spawn with the stdout/stderr redirection and environment
      hooks
    - thread, mutex, rwlock, cond and TLS wrappers including timed waits
      and the cleanup destructors
  The Win32 files remain as the behavioural reference; do not change the
  call sites under src/.
prepare:
  remove:
  - src/util/unix/process.c
  - src/util/unix/pthread.h
  - src/util/unix/posix.h
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=ON -DBUILD_CLI=OFF -DUSE_SSH=OFF
    -DUSE_HTTPS=OFF -DUSE_BUNDLED_ZLIB=ON -DREGEX_BACKEND=builtin && cmake --build {build} -j2
  artifact: '{build}/libgit2.a'
hidden_tests:
  command: cd {build} && ./util_tests -v -sprocess::start && ./libgit2_tests -v -sthreads::basic -sthreads::tlsdata
task_id: l2_libgit2_process
