scenario: cuda_to_ascend
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  soc: ascend-910b2
  backend: cann-9.1.0
  toolchain: bisheng
gates:
  build: the upstream evaluator compiles the submission for Ascend
  api_removal:
    source_dirs:
    - submission
    source_regex: __global__|__shared__|threadIdx|blockIdx|<<<|cuda[A-Z]\w*\(|#include\s*[<"]cuda|nvcc
    exclude_globs: []
  behavior: upstream numerical reference matches within the task tolerance
build:
  mode: none
  command: ''
  artifact: ''
id: b_l2_mk_standard_matmul
level: L2
domain: matmul
difficulty: medium
title: MultiKernelBench standard matrix multiplication
source:
  repo: https://github.com/wzzll123/MultiKernelBench.git
  commit: 460a972c9be7ce18035984321d38b910e27df95f
  license: MIT
  source_files:
  - reference/matmul/standard_matrix_multiplication.py
  gold_files: []
  test_files:
  - utils/correctness.py
spec: 'Implement `standard_matrix_multiplication` as an AscendC operator using

  the cube unit or a vector-tiled fallback.  The reference

  (`reference/matmul/standard_matrix_multiplication.py`) defines the

  transpose flags, dtypes and bias handling.


  Write `work/submission/standard_matrix_multiplication_submission.py`

  with the six backend strings.  The anti-cheat detector rejects a

  submission whose `ModelNew` calls `torch.matmul`.

  '
hidden_tests:
  command: cd {work} && python eval_single_runner.py --input {work}/submission/standard_matrix_multiplication_submission.py
    --op standard_matrix_multiplication --language ascendc --result {build}/result.json && python {root}/harness/check_result.py
    {build}/result.json --require-compiled --require-correct --forbid-cheating
task_id: b_l2_mk_standard_matmul
