scenario: cuda_to_ascend
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  soc: ascend-910b2
  backend: cann-9.1.0
  toolchain: bisheng
gates:
  build: the upstream evaluator compiles the submission for Ascend
  api_removal:
    source_dirs:
    - submission
    source_regex: __global__|__shared__|threadIdx|blockIdx|<<<|cuda[A-Z]\w*\(|#include\s*[<"]cuda|nvcc
    exclude_globs: []
  behavior: upstream numerical reference matches within the task tolerance
build:
  mode: none
  command: ''
  artifact: ''
id: b_l2_cross_entropy_loss
level: L2
domain: loss
difficulty: medium
title: 'CrossEntropyLoss: CUDA fused loss -> Ascend C'
source:
  repo: https://gitcode.com/cann/cann-bench.git
  commit: 53ea611a1b88da922b82812f2721dd0b2fa33476
  license: CANN-OSL-2.0
  source_files:
  - tasks/level2/cross_entropy_loss/golden.py
  - tasks/level2/cross_entropy_loss/desc.md
  spec_files:
  - tasks/level2/cross_entropy_loss/proto.yaml
  test_files:
  - tasks/level2/cross_entropy_loss/cases.yaml
  gold_files: []
spec: 'Implement `CrossEntropyLoss` (log-softmax + NLL, with the reduction modes,

  ignore index and optional weight from `proto.yaml`).  Numerical stability

  for fp16 logits is part of the test.


  Submission root: `work/submission/` with `build.sh`.

  '
hidden_tests:
  command: cd {work} && bash scripts/run_evaluation.sh --source-dir {work}/submission --task-dir {work}/tasks/level2/cross_entropy_loss
    --operator CrossEntropyLoss --device npu --no-perf --reports-dir {build}/reports
task_id: b_l2_cross_entropy_loss
