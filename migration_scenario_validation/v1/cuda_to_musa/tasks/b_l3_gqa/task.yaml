scenario: cuda_to_musa
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  gpu: mtt-s4000
  backend: musa-sdk-5.2.0
  toolchain: mcc
  arch: x86_64
gates:
  build: the upstream evaluator imports the submission and builds its MUSA extension on musa:0
  api_removal:
    source_dirs:
    - submission
    source_regex: torch\.cuda|\.cuda\(\)|cuda[A-Z]\w*\s*\(|#include\s*[<"]cuda|#include\s*[<"]cublas|#include\s*[<"]cudnn|#include\s*[<"]cufft|\bnvcc\b|\bcublas[A-Za-z0-9_]*\s*\(|\bcudnn[A-Za-z0-9_]*\s*\(|\bcufft[A-Za-z0-9_]*\s*\(|device\s*=\s*['"]cuda|\bCUDA_[A-Z0-9_]+|__CUDACC__
    exclude_globs: []
  behavior: upstream numerical reference matches within atol=rtol=1e-4
build:
  mode: none
  command: ''
  artifact: ''
prepare:
  remove_globs:
  - prompts/musa_new_model_*.py
id: b_l3_gqa
level: L3
domain: attention
difficulty: hard
op_name: group_query_attention
title: 'GQA: grouped-query attention -> MUSA kernel'
source:
  repo: https://github.com/wzzll123/MultiKernelBench.git
  commit: 460a972c9be7ce18035984321d38b910e27df95f
  license: MIT
  source_files:
  - reference/attention/group_query_attention.py
  test_files:
  - utils/correctness.py
  - utils/cheating_detection.py
spec: |
  `reference/attention/group_query_attention.py` is the upstream operator
  contract.  MultiKernelBench does not ship a per-op CUDA sample for this
  operator at the pinned commit; the CUDA side is a fused grouped-query
  attention.

  Write the submission file named by the task under `work/submission/`; it must define `ModelNew`.
hidden_tests:
  command: cd {work} && python3 eval_single_runner.py --input {work}/submission/group_query_attention_submission.py
    --op group_query_attention --language musa --result {build}/result.json && python3 {root}/harness/check_result.py
    {build}/result.json --require-compiled --require-correct --forbid-cheating && python3 {root}/harness/check_musa_submission.py
    {work}/submission/group_query_attention_submission.py
task_id: b_l3_gqa
