# Single run configuration for the paired migration benchmark.
#
# Both arms read this one file.  Model, task budgets, images, judge and task
# selection are shared so the two arms stay comparable.  The method arm is one
# main agent that runs the fixed component-method workflow and then the same
# migration task in the same session; it has no step limit.  A step budget
# applies only to a separate extra task-execution agent, which the runner does
# not start.
#
# Every value may use ${VAR} or ${VAR:-default}; the environment wins.

schema: migration-bench-v1

# The package that owns the DSH runtime and the component_method pipeline.
# This directory now lives inside it, so the root is the parent directory.
repository_root: ${MIGRATION_REPOSITORY_ROOT:-..}

paths:
  report_root: reports/bench
  workspace_root: reports/bench/workspaces
  cache: ${MIGRATION_BENCH_CACHE:-~/.cache/migration-bench}

arms:
  default:
    # Plain DSH: the profile only inserts controlled-bash, no method plugins.
    dsh_profile: ${BENCH_DEFAULT_DSH_PROFILE:-component-method}
  method:
    # One main agent with the method plugins; it prepares and migrates.
    dsh_profile: ${BENCH_METHOD_DSH_PROFILE:-component-method-migration}
    # Image for the preparation containers (source scan, extraction, review,
    # retrieval).  They run on the benchmark host, not on the task host, so the
    # image must exist locally.  Empty = the scenario image.  Remote MUSA needs
    # an explicit value because migration/musa:* lives only on the MUSA box.
    stage_image: ${METHOD_STAGE_IMAGE:-}

# Model credentials are deliberately NOT configured here.  migration_trial
# resolves them in this order: CLI flag, .env at the repository root (../.env),
# inherited environment; that .env is the project-owned route and must keep
# winning over a stale shell export.  Put secrets in bench.env or ../.env.

# Which task slates the run covers.  `--scenario` on the CLI overrides this.
scenarios:
  ipp_to_vsipl:
    enabled: true
    parent: v1/ipp_vsipl_tasks
    image: ${IPP_IMAGE:-migration/ipp:cpu}
    # Required for this scenario.  Point VSIPL_ROOT at a jvsip tree that has
    # include/vsip.h and lib/libvsip.a; there is no machine-specific default.
    vsipl_root: ${VSIPL_ROOT:-}
    build:
      - ["docker", "build", "-f", "env/Dockerfile.ipp", "-t", "migration/ipp:cpu", "."]
  # IPP V3 self-built library sources + held-out smoke task.  Disabled by
  # default; select explicitly with --scenario ipp_to_vsipl_v3.
  ipp_to_vsipl_v3:
    enabled: false
    parent: v3/ipp_vsipl/tasks
    image: ${IPP_IMAGE:-migration/ipp:cpu}
    vsipl_root: ${VSIPL_ROOT:-}
    library_dir: v3/ipp_vsipl/library
    build: []

  windows_to_kylin:
    enabled: true
    parent: v1/windows_to_kylin/tasks
    image: ${KYLIN_IMAGE:-migration/kylin:sp3-p2}
    build:
      - ["docker", "build", "-f", "env/Dockerfile.kylin", "-t", "migration/kylin:sp3", "."]
      - ["docker", "build", "-f", "env/Dockerfile.kylin-agent", "-t", "migration/kylin:sp3-p2", "."]
  # V3 consolidated task tree.  Every Windows -> Kylin package lives under
  # v3/windows_to_kylin/tasks/ and the hand-written transformation library
  # lives under v3/windows_to_kylin/library/.  A task may override the library
  # with `library_manifest` in task.yaml (v3_poco_fs_stack points at
  # library_generated/demo_new_flow_v4; the component-first tasks point at
  # library_generated/full_20261123).  The slate assigns roles (library
  # source, pilot, held-out, boundary, negative, synthetic), so select the
  # evaluation subset with --only.  Disabled by default; 22 of the 25 slate
  # packages are runnable.
  windows_to_kylin_v3:
    enabled: false
    parent: v3/windows_to_kylin/tasks
    image: ${KYLIN_IMAGE:-migration/kylin:sp3-p2}
    library_dir: v3/windows_to_kylin/library
    build: []
  cuda_to_musa:
    enabled: false
    parent: v1/cuda_to_musa/tasks
    image: ${MUSA_IMAGE:-migration/musa:s4000}
    transport: ${MUSA_TRANSPORT:-auto}
    remote_config: ${MUSA_REMOTE_CONFIG:-env/remote.yaml}
    # No reproducible build command yet: env/Dockerfile.musa needs vendor
    # build args and a real MTT S4000.  `bench env` reports it as manual.
    build: []

  # CUDA -> MUSA V3 self-built library sources and held-out tasks.  The
  # execution plane is the remote S4000, same as the V1 MUSA scenario.
  cuda_to_musa_v3:
    enabled: false
    parent: v3/cuda_to_musa/tasks
    image: ${MUSA_IMAGE:-migration/musa:s4000}
    transport: ${MUSA_TRANSPORT:-auto}
    remote_config: ${MUSA_REMOTE_CONFIG:-env/remote.yaml}
    library_dir: v3/cuda_to_musa/library
    build: []

budgets:
  runs: 1
  # Default (A) task budget.
  step_limit: 150
  context_window: 262144
  max_output_tokens: 32768
  command_timeout: 600
  total_timeout: 5400
  prepare_timeout: 1800
  judge_timeout: 2400
  # Method main agent: no step limit by default; this is only a wall-clock
  # safety cap.  Set method_step_limit for a same-budget comparison.
  method_main_timeout: 14400
  method_step_limit: null
  method_extraction_workers: 2
  method_review_workers: 2
  method_agent_timeout: 3600