scenario: cuda_to_ascend
fit: C
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  soc: ascend-910b2
  backend: cann-9.1.0
  toolchain: bisheng
gates:
  build: the upstream evaluator compiles the submission for Ascend
  api_removal:
    source_dirs:
    - submission
    source_regex: __global__|__shared__|threadIdx|blockIdx|<<<|cuda[A-Z]\w*\(|#include\s*[<"]cuda|nvcc
    exclude_globs: []
  behavior: upstream numerical reference matches within the task tolerance
build:
  mode: none
  command: ''
  artifact: ''
id: b_l3_conv_2d
level: L3
domain: convolution
difficulty: hard
title: 'Conv2D: cuDNN-style convolution -> Ascend C'
source:
  repo: https://gitcode.com/cann/cann-bench.git
  commit: 53ea611a1b88da922b82812f2721dd0b2fa33476
  license: CANN-OSL-2.0
  source_files:
  - tasks/level3/conv_2d/golden.py
  - tasks/level3/conv_2d/desc.md
  spec_files:
  - tasks/level3/conv_2d/proto.yaml
  test_files:
  - tasks/level3/conv_2d/cases.yaml
  gold_files: []
spec: 'Implement `Conv2D` for the shapes in `cases.yaml`: stride, padding,

  dilation, groups and bias.  The cube unit is expected; a correct

  vectorised direct convolution is acceptable if it passes every case.


  Submission root: `work/submission/` with `build.sh`.

  '
hidden_tests:
  command: cd {work} && bash scripts/run_evaluation.sh --source-dir {work}/submission --task-dir {work}/tasks/level3/conv_2d
    --operator Conv2D --device npu --no-perf --reports-dir {build}/reports
task_id: b_l3_conv_2d
