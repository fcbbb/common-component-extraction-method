scenario: cuda_to_ascend
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  soc: ascend-910b2
  backend: cann-9.1.0
  toolchain: bisheng
gates:
  build: the upstream evaluator compiles the submission for Ascend
  api_removal:
    source_dirs:
    - submission
    source_regex: __global__|__shared__|threadIdx|blockIdx|<<<|cuda[A-Z]\w*\(|#include\s*[<"]cuda|nvcc
    exclude_globs: []
  behavior: upstream numerical reference matches within the task tolerance
build:
  mode: none
  command: ''
  artifact: ''
id: b_l1_mk_mse_loss
level: L1
domain: loss
difficulty: easy
title: 'MultiKernelBench mse_loss: CUDA model -> AscendC submission'
source:
  repo: https://github.com/wzzll123/MultiKernelBench.git
  commit: 460a972c9be7ce18035984321d38b910e27df95f
  license: MIT
  source_files:
  - prompts/cuda_model_mse_loss.py
  - reference/loss/mse_loss.py
  gold_files:
  - prompts/ascendc_new_model_mse_loss.py
  test_files:
  - utils/correctness.py
spec: 'Migrate the mean-squared-error kernel.  The CUDA sample and the PyTorch

  reference (`reference/loss/mse_loss.py`) are visible; the upstream

  AscendC sample was removed.


  Write `work/submission/mse_loss_submission.py` with the six source

  strings described in the MultiKernelBench AscendC backend.  The kernel

  must reduce over all elements, match the reference''s mean convention and

  dtype promotion, and pass the anti-cheat detector.

  '
prepare:
  remove:
  - prompts/ascendc_new_model_mse_loss.py
hidden_tests:
  command: cd {work} && python eval_single_runner.py --input {work}/submission/mse_loss_submission.py
    --op mse_loss --language ascendc --result {build}/result.json && python {root}/harness/check_result.py
    {build}/result.json --require-compiled --require-correct --forbid-cheating
task_id: b_l1_mk_mse_loss
