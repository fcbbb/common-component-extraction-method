      Submission root: `work/submission/` with `build.sh`.
    hidden_tests:
      command: "cd {work} && bash scripts/run_evaluation.sh --source-dir {work}/submission --task-dir {work}/tasks/level2/softmax --operator Softmax --device npu --no-perf --reports-dir {build}/reports"

