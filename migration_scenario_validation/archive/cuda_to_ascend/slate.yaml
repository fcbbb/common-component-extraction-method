# Scenario B: NVIDIA CUDA / Triton -> Ascend C / CANN.
#
# Both upstream benchmarks are used as *judges*: the agent writes an Ascend
# implementation into `work/submission/`, and the pinned upstream evaluator
# compiles it, runs the upstream PyTorch reference and reports compile /
# correctness / anti-cheat.  The reference implementations stay visible on
# purpose (they define the contract); the corresponding AscendC sample, when
# the upstream repo ships one, is removed from `work/` and kept in `gold/`.
scenario: cuda_to_ascend

defaults:
  scenario: cuda_to_ascend
  fit: B
  counted: true
  layout: repo
  gold_kind: benchmark-judge
  source_kind: upstream-kernel-benchmark
  tolerances: {}
  target:
    soc: ascend-910b2
    backend: cann-9.1.0
    toolchain: bisheng
  gates:
    build: "the upstream evaluator compiles the submission for Ascend"
    api_removal:
      source_dirs:
        - submission
      source_regex: "__global__|__shared__|threadIdx|blockIdx|<<<|cuda[A-Z]\\w*\\(|#include\\s*[<\"]cuda|nvcc"
      exclude_globs: []
    behavior: "upstream numerical reference matches within the task tolerance"
  build:
    mode: none
    command: ""
    artifact: ""

tasks:
  # ------------------------------------------------------------------ L1 ---
  - id: b_l1_exp
    level: L1
    domain: elementwise
    difficulty: easy
    title: "Exp: CUDA elementwise kernel -> Ascend C"
    source:
      repo: https://gitcode.com/cann/cann-bench.git
      commit: 53ea611a1b88da922b82812f2721dd0b2fa33476
      license: CANN-OSL-2.0
      source_files:
        - tasks/level1/exp/golden.py
        - tasks/level1/exp/desc.md
      spec_files:
        - tasks/level1/exp/proto.yaml
      test_files:
        - tasks/level1/exp/cases.yaml
        - tasks/level1/exp/cases.csv
      gold_files: []
    spec: |
      Implement operator `Exp` for Ascend 910B/CANN 9.1 as an AscendC kernel.

      Read `tasks/level1/exp/proto.yaml` for the interface and
      `tasks/level1/exp/desc.md` for the required semantics; `golden.py` is the
      PyTorch reference the judge uses.  Put the operator source tree in
      `work/submission/` with a `build.sh` at its root (start from
      `examples/aclnn_launch_example/`).

      The kernel must compute exp elementwise over the declared dtypes and
      shapes, handle unaligned tails, and not fall back to PyTorch ops.  The
      upstream evaluator compiles/installs the submission and checks every
      case in `cases.yaml` on the NPU.
    hidden_tests:
      command: "cd {work} && bash scripts/run_evaluation.sh --source-dir {work}/submission --task-dir {work}/tasks/level1/exp --operator Exp --device npu --no-perf --reports-dir {build}/reports"

  - id: b_l1_swi_glu
    level: L1
    domain: fused-activation
    difficulty: easy
    title: "SwiGLU: CUDA fused activation -> Ascend C"
    source:
      repo: https://gitcode.com/cann/cann-bench.git
      commit: 53ea611a1b88da922b82812f2721dd0b2fa33476
      license: CANN-OSL-2.0
      source_files:
        - tasks/level1/swi_glu/golden.py
        - tasks/level1/swi_glu/desc.md
      spec_files:
        - tasks/level1/swi_glu/proto.yaml
      test_files:
        - tasks/level1/swi_glu/cases.yaml
        - tasks/level1/swi_glu/cases.csv
      gold_files: []
    spec: |
      Implement operator `SwiGlu` in AscendC.  SwiGLU is the fused
      `silu(x1) * x2` gate used in transformer MLPs; the judge checks the
      split/alignment rules and the dtype mix in `cases.yaml`.

      Submission root: `work/submission/` with `build.sh`.  Use the CANN
      vector instructions (or aclnn composition) rather than a Python
      fallback; the evaluator's anti-cheat checks that the submitted kernel is
      what runs.
    hidden_tests:
      command: "cd {work} && bash scripts/run_evaluation.sh --source-dir {work}/submission --task-dir {work}/tasks/level1/swi_glu --operator SwiGlu --device npu --no-perf --reports-dir {build}/reports"

  - id: b_l1_mk_leaky_relu
    level: L1
    domain: activation
    difficulty: easy
    title: "MultiKernelBench leaky_relu: CUDA model -> AscendC submission"
    source:
      repo: https://github.com/wzzll123/MultiKernelBench.git
      commit: 460a972c9be7ce18035984321d38b910e27df95f
      license: MIT
      source_files:
        - prompts/cuda_model_leaky_relu.py
        - reference/activation/leaky_relu.py
      gold_files:
        - prompts/ascendc_new_model_leaky_relu.py
      test_files:
        - utils/correctness.py
        - utils/cheating_detection.py
    spec: |
      `prompts/cuda_model_leaky_relu.py` is the CUDA/AscendC sample pair
      upstream ships; the AscendC sample has been removed and only the CUDA
      side plus the PyTorch reference remain.

      Write `work/submission/leaky_relu_submission.py` defining the six
      strings the AscendC backend consumes:
      `project_json_src`, `host_tiling_src`, `host_operator_src`,
      `kernel_src`, `python_bind_src`, `model_src`
      (the shape used by the removed sample and by the other
      `prompts/ascendc_new_model_*.py` files).

      The evaluator (`eval_single_runner.py --language ascendc`) runs msopgen,
      builds and installs the operator, executes the reference
      `reference/activation/leaky_relu.py` against `ModelNew`, and applies the
      anti-cheat detector.
    prepare:
      remove:
        - prompts/ascendc_new_model_leaky_relu.py
    hidden_tests:
      command: "cd {work} && python eval_single_runner.py --input {work}/submission/leaky_relu_submission.py --op leaky_relu --language ascendc --result {build}/result.json && python {root}/harness/check_result.py {build}/result.json --require-compiled --require-correct --forbid-cheating"

  - id: b_l1_mk_mse_loss
    level: L1
    domain: loss
    difficulty: easy
    title: "MultiKernelBench mse_loss: CUDA model -> AscendC submission"
    source:
      repo: https://github.com/wzzll123/MultiKernelBench.git
      commit: 460a972c9be7ce18035984321d38b910e27df95f
      license: MIT
      source_files:
        - prompts/cuda_model_mse_loss.py
        - reference/loss/mse_loss.py
      gold_files:
        - prompts/ascendc_new_model_mse_loss.py
      test_files:
        - utils/correctness.py
    spec: |
      Migrate the mean-squared-error kernel.  The CUDA sample and the PyTorch
      reference (`reference/loss/mse_loss.py`) are visible; the upstream
      AscendC sample was removed.

      Write `work/submission/mse_loss_submission.py` with the six source
      strings described in the MultiKernelBench AscendC backend.  The kernel
      must reduce over all elements, match the reference's mean convention and
      dtype promotion, and pass the anti-cheat detector.
    prepare:
      remove:
        - prompts/ascendc_new_model_mse_loss.py
    hidden_tests:
      command: "cd {work} && python eval_single_runner.py --input {work}/submission/mse_loss_submission.py --op mse_loss --language ascendc --result {build}/result.json && python {root}/harness/check_result.py {build}/result.json --require-compiled --require-correct --forbid-cheating"

  - id: b_l1_mk_sum_reduction
    level: L1
    domain: reduction
    difficulty: easy
    title: "MultiKernelBench sum reduction over a dimension"
    source:
      repo: https://github.com/wzzll123/MultiKernelBench.git
      commit: 460a972c9be7ce18035984321d38b910e27df95f
      license: MIT
      source_files:
        - reference/reduce/sum_reduction_over_a_dimension.py
      gold_files: []
      test_files:
        - utils/correctness.py
    spec: |
      Implement `sum_reduction_over_a_dimension` as an AscendC operator.  The
      reference is `reference/reduce/sum_reduction_over_a_dimension.py`; the
      reference signature (including the `dim` and `keepdim` arguments) is the
      contract.

      Write `work/submission/sum_reduction_over_a_dimension_submission.py`
      with the six backend strings.  Handle non-contiguous reduction axes by
      tiling rather than by materialising a transposed tensor through PyTorch.
    hidden_tests:
      command: "cd {work} && python eval_single_runner.py --input {work}/submission/sum_reduction_over_a_dimension_submission.py --op sum_reduction_over_a_dimension --language ascendc --result {build}/result.json && python {root}/harness/check_result.py {build}/result.json --require-compiled --require-correct --forbid-cheating"

  - id: b_l1_softmax
    level: L1
    domain: normalization
    difficulty: medium
    title: "Softmax: CUDA row softmax -> Ascend C"
    source:
      repo: https://gitcode.com/cann/cann-bench.git
      commit: 53ea611a1b88da922b82812f2721dd0b2fa33476
      license: CANN-OSL-2.0
      source_files:
        - tasks/level2/softmax/golden.py
        - tasks/level2/softmax/desc.md
      spec_files:
        - tasks/level2/softmax/proto.yaml
      test_files:
        - tasks/level2/softmax/cases.yaml
