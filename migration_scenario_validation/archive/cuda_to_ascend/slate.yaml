  - id: b_l2_cross_entropy_loss
    level: L2
    domain: loss
    difficulty: medium
    title: "CrossEntropyLoss: CUDA fused loss -> Ascend C"
    source:
      repo: https://gitcode.com/cann/cann-bench.git
