      artifact: "{build}/src/curl"
    hidden_tests:
      command: "bash {root}/harness/tls_probe.sh --port 18444 --path {build}/src/curl"
    gates:
      api_removal:
        source_dirs:
          - CMakeLists.txt
          - CMake
      target_api:
        source_dirs:
          - CMakeLists.txt
          - CMake
        source_regex: '(?i)\b(?:cmake|configure|make)\b'
        min_hits: 1
      behavior: >-
        the agent-authored build produces libcurl and the tool from this tree
        and a real TLS request succeeds
      regression: "the produced tool reports its version and exits cleanly"