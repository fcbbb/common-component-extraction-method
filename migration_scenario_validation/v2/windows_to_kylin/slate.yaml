  # ------------------------------------------------------------ curl TLS ---
  - id: v2_curl_tls
    level: L2
    family: curl_tls
    family_type: pattern
    sequence: 12
    domain: networking
    difficulty: hard
    source_kind: upstream_platform_port
    title: "Migrate the curl TLS backend to Kylin V10 SP3"
    library_manifest: v2/windows_to_kylin/library/curl/lock.json
    source:
      repo: https://github.com/curl/curl.git
      commit: 7161cb17c01dcff1dc5bf89a18437d9d729f1ecd
      tag: curl-8_5_0
      license: curl
      windows_files:
        - lib/vtls/schannel.c
        - lib/vtls/schannel_verify.c
        - lib/vtls/schannel.h
      gold_files:
        - lib/vtls/openssl.c
      test_files:
        - tests/data/test3000
        - tests/data/test3001
    spec: |
      curl is being moved from Windows to Kylin V10 SP3.  The target-platform
      TLS backend has not been written yet.

      Implement the backend behind curl's existing TLS abstraction: backend
      registration and version reporting, certificate and hostname
      verification, server name indication, ALPN, session reuse, blocking and
      non-blocking handshakes integrated with the transfer state machine
      (including would-block return codes), client certificates, revocation
      checks and public-key pinning.  The generic TLS interface, its callers,
      the Windows backend and the build entry stay visible as the reference.

      Scope: the TLS backend only; do not change the generic interface or
      call sites.  The library and tool must build with the repository build
      entry against the platform TLS library, and a real handshake against a
      local TLS server must succeed.
    prepare:
      remove:
        - lib/vtls/openssl.c
    harness:
      scripts:
        - tls_probe.sh
    build:
      command: "cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCURL_USE_OPENSSL=ON -DUSE_NGHTTP2=OFF -DCURL_USE_LIBPSL=OFF -DBUILD_TESTING=ON -DBUILD_CURL_EXE=ON && cmake --build {build} -j2"
      artifact: "{build}/src/curl"
    hidden_tests:
      command: "bash {root}/harness/tls_probe.sh --port 18443 --path {build}/src/curl"
    gates:
      api_removal:
        source_dirs:
          - lib/vtls/openssl.c
      behavior: >-
        curl builds and completes a real TLS request through the rebuilt
        backend
      regression: "the tool still reports its version and exits cleanly"

  - id: v2_curl_build
    level: L3
    family: curl_build
    family_type: build_system
    sequence: 13
    domain: build-system
    difficulty: hard
    source_kind: build_system_port
    title: "Migrate the curl build system to CMake on Kylin V10 SP3"
    library_manifest: v2/windows_to_kylin/library/curl/lock.json
    source:
      repo: https://github.com/curl/curl.git
      commit: 7161cb17c01dcff1dc5bf89a18437d9d729f1ecd
      tag: curl-8_5_0
      license: curl
      windows_files:
        - projects/Windows/VC14.30/lib/libcurl.sln
        - winbuild/Makefile.vc
      gold_files:
        - CMakeLists.txt
        - CMake
      test_files:
        - tests/data/test3000
        - tests/data/test3001
    spec: |
      curl is being moved from Windows to Kylin V10 SP3.  The top-level CMake
      build system has not been written yet; only the Windows project files
      and the nmake build remain.

      Produce a CMake build for Kylin that builds libcurl and the curl tool
      with the required TLS and compression support, generates the
      configuration header with the feature macros the sources expect, accepts
      the documented cache options, installs headers and libraries, and
      compiles entirely from this tree.  Do not vendor a prebuilt libcurl.

      Scope: the build system only; the library sources stay unchanged.
      Acceptance: the build succeeds with the documented options and the tool
