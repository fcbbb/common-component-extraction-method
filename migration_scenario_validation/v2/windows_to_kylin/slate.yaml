  - id: v2_nginx_files
    level: L2
    family: nginx_os
    family_type: pattern
    sequence: 10
    domain: networking
    difficulty: medium
    source_kind: upstream_platform_port
    title: "Migrate the nginx file layer to Kylin V10 SP3"
    library_manifest: v2/windows_to_kylin/library/nginx/lock.json
    source:
      repo: https://github.com/nginx/nginx.git
      commit: 1be0fb0c9f9bc3489c7b40576efd6afe6b2eccd5
      tag: release-1.26.3
      license: BSD-2-Clause
      windows_files:
        - src/os/win32/ngx_files.c
        - src/os/win32/ngx_files.h
      gold_files:
        - src/os/unix/ngx_files.c
      test_files:
        - src/os/unix/ngx_files.h
      extra_repos:
        - name: nginx-tests
          repo: https://github.com/nginx/nginx-tests.git
          commit: c0b7894063022fb86d5b5ad732c08507ea03aa78
          dest: nginx-tests
    spec: |
      nginx is being moved from Windows to Kylin V10 SP3.  The target-platform
      file layer has not been written yet.

      Reimplement the file abstraction used by the whole server: file opening
      and closing, sequential and positioned I/O, metadata queries, rename and
      deletion, directory creation and iteration, symbolic links, timestamp
      updates, path canonicalisation and error-code translation.  The module
      headers, the server core, the Win32 implementation and the configure
      entry stay visible as the reference.

      Scope: the file layer only; do not change module interfaces or build
      configuration.  Acceptance: nginx builds with its own configure entry,
      serves static content, and passes the selected upstream file-serving
      tests.
    prepare:
      remove:
        - src/os/unix/ngx_files.c
    harness:
      scripts:
        - nginx_smoke.sh
    build:
      command: "./auto/configure --prefix={build}/nginx --without-http_rewrite_module --without-http_gzip_module && make -j"
      artifact: "{work}/objs/nginx"
    hidden_tests:
      command: >-
        bash {root}/harness/nginx_smoke.sh --binary {work}/objs/nginx
        --port 28080 && cd {work}/nginx-tests &&
        TEST_NGINX_BINARY={work}/objs/nginx prove -I lib autoindex.t range.t
    gates:
      api_removal:
        source_dirs:
          - src/os/unix/ngx_files.c
      behavior: >-
        the server builds, serves static content, and the selected upstream
        file-serving tests pass
      regression: "the server starts and serves a static file without a crash"

