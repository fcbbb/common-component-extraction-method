scenario: windows_to_kylin
fit: B
counted: true
source_kind: upstream-platform-port
gold_kind: implementation
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: '3.28'
gates:
  build: configure and build the task target on Kylin V10
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - src/unix/thread.c
  behavior: libuv thread/threadpool tests pass
id: l2_libuv_thread
level: L2
domain: runtime
difficulty: medium
title: 'libuv thread layer: Win32 threads -> pthreads'
source:
  repo: https://github.com/libuv/libuv.git
  commit: e9f29cb984231524e3931aa0ae2c5dae1a32884e
  tag: v1.48.0
  license: MIT
  windows_files:
  - src/win/thread.c
  gold_files:
  - src/unix/thread.c
  test_files:
  - test/test-thread.c
  - test/test-thread-affinity.c
  - test/test-thread-equal.c
  - test/test-thread-priority.c
  - test/test-threadpool.c
spec: '`src/unix/thread.c` was removed.  Reimplement libuv''s threading layer

  with pthreads: uv_thread_create/join/equal/self, thread names and

  affinity/priority, uv_mutex/uv_rwlock/uv_sem/uv_cond/uv_barrier,

  uv_once, TLS keys and the thread-pool (uv_queue_work /

  uv_cancel).  Preserve the documented return codes and the

  EAGAIN-on-exhaustion behaviour.

  '
prepare:
  remove:
  - src/unix/thread.c
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLIBUV_BUILD_SHARED=ON
    && cmake --build {build} -j
  artifact: '{build}/libuv.a'
hidden_tests:
  command: cd {work} && {build}/uv_run_tests_a thread_create && {build}/uv_run_tests_a thread_equal && {build}/uv_run_tests_a
    thread_affinity && {build}/uv_run_tests_a thread_priority && {build}/uv_run_tests_a thread_mutex && {build}/uv_run_tests_a
    thread_rwlock && {build}/uv_run_tests_a thread_local_storage && {build}/uv_run_tests_a barrier_serial_thread &&
    {build}/uv_run_tests_a condvar_1 && {build}/uv_run_tests_a semaphore_1 && {build}/uv_run_tests_a threadpool_queue_work_simple
    && {build}/uv_run_tests_a threadpool_cancel_single
task_id: l2_libuv_thread
