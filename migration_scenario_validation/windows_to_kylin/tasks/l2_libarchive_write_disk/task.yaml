scenario: windows_to_kylin
fit: B
counted: true
source_kind: upstream-platform-port
gold_kind: implementation
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: '3.16.5'
gates:
  build: configure and build the task target on Kylin V10
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - libarchive/archive_write_disk_posix.c
  behavior: upstream write-disk tests pass
id: l2_libarchive_write_disk
level: L2
domain: archives
difficulty: hard
title: 'libarchive write_disk: Win32 restore -> POSIX restore'
source:
  repo: https://github.com/libarchive/libarchive.git
  commit: 313aa1fa10b657de791e3202c168a6c833bc3543
  tag: v3.7.4
  license: BSD-2-Clause
  windows_files:
  - libarchive/archive_write_disk_windows.c
  - libarchive/archive_write_disk_private.h
  gold_files:
  - libarchive/archive_write_disk_posix.c
  test_files:
  - libarchive/test/test_write_disk.c
  - libarchive/test/test_write_disk_failures.c
  - libarchive/test/test_write_disk_perms.c
  - libarchive/test/test_write_disk_secure.c
  - libarchive/test/test_write_disk_hardlink.c
spec: "`archive_write_disk_posix.c` was removed.  Reimplement restore-to-disk\non Kylin, keeping the Win32\
  \ implementation as the reference:\n  - mkdir/rename/link/symlink with overwrite, no-overwrite and\n\
  \    secure-symlink policies;\n  - mode bits, ownership where permitted, timestamps, ACL/xattr flags;\n\
  \  - sparse file writing and hardlink bookkeeping;\n  - the documented error mapping for EEXIST/EPERM/ENOTSUP\
  \ and the\n    `ARCHIVE_EXTRACT_*` flags.\n"
prepare:
  remove:
  - libarchive/archive_write_disk_posix.c
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DENABLE_TEST=ON -DENABLE_TAR=OFF -DENABLE_CPIO=OFF
    -DENABLE_CAT=OFF && cmake --build {build} -j2
  artifact: '{build}/libarchive/libarchive.a'
hidden_tests:
  command: mkdir -p {build}/test-run && cd {build}/test-run && ../bin/libarchive_test -r {work}/libarchive/test
    test_write_disk test_write_disk_failures test_write_disk_perms test_write_disk_secure test_write_disk_hardlink
task_id: l2_libarchive_write_disk
