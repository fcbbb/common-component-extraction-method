scenario: windows_to_kylin
fit: C
counted: true
source_kind: upstream-platform-port
gold_kind: none
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: '3.16.5'
gates:
  build: 'not applicable: the module cannot be built on Kylin'
  api_removal:
    symbol_regex: ^(ReportEvent|RegisterEventSource|DeregisterEventSource|OpenEventLog)
    source_regex: windows\.h|ReportEvent|RegisterEventSource|HKEY_|RegCreateKey|pocomsg
    exclude_globs: []
    expect_fail: true
    source_dirs:
    - Foundation/src/EventLogChannel.cpp
  behavior: PORTING_NOTES.md documents the non-portability and no fake backend is added
id: negative_win32_eventlog
level: L3
domain: negative
difficulty: hard
title: 'Negative control: Windows Event Log channel has no equivalent'
negative: true
expected_api_removal: fail
source:
  repo: https://github.com/pocoproject/poco.git
  commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
  tag: poco-1.13.3-release
  license: BSL-1.0
  windows_files:
  - Foundation/src/EventLogChannel.cpp
  - Foundation/include/Poco/EventLogChannel.h
  - Foundation/src/pocomsg.mc
  gold_files: []
  test_files: []
spec: "`Poco::EventLogChannel` writes to the Windows Event Log through\nReportEvent, registers an event\
  \ source in the registry and loads\nmessage-table resources compiled from `pocomsg.mc`.  Kylin has no\n\
  Event Log service, no equivalent registry event-source registration and\nno message-table resource compiler.\n\
  \nThe correct outcome is an explicit non-portability report, not a stub\nthat silently drops log records.\
  \  Write `work/PORTING_NOTES.md` that:\n  - names the platform-only APIs and where they are used;\n\
  \  - explains why syslog/journald is not a behaviour-preserving\n    replacement (different record model,\
  \ source registration, IDs);\n  - states what a product team would have to redesign.\nThe API-removal\
  \ gate is expected to FAIL on this task; it is a control\nfor \"the agent fabricated a port\".\n"
prepare:
  remove: []
build:
  mode: none
  command: ''
hidden_tests:
  command: test -s {work}/PORTING_NOTES.md && grep -qiE 'event ?log|not portable|no (direct )?(linux|posix|kylin)
    equivalent' {work}/PORTING_NOTES.md
task_id: negative_win32_eventlog
