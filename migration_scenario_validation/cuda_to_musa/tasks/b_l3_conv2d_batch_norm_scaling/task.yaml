scenario: cuda_to_musa
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  gpu: mtt-s4000
  backend: musa-sdk-5.2.0
  toolchain: mcc
  arch: x86_64
gates:
  build: the upstream evaluator imports the submission and builds its MUSA extension on musa:0
  api_removal:
    source_dirs:
    - submission
    source_regex: torch\.cuda|\.cuda\(\)|cuda[A-Z]\w*\s*\(|#include\s*[<"]cuda|#include\s*[<"]cublas|#include\s*[<"]cudnn|#include\s*[<"]cufft|\bnvcc\b|\bcublas[A-Za-z0-9_]*\s*\(|\bcudnn[A-Za-z0-9_]*\s*\(|\bcufft[A-Za-z0-9_]*\s*\(|device\s*=\s*['"]cuda|\bCUDA_[A-Z0-9_]+|__CUDACC__
    exclude_globs: []
  behavior: upstream numerical reference matches within atol=rtol=1e-4
build:
  mode: none
  command: ''
  artifact: ''
prepare:
  remove_globs:
  - prompts/musa_new_model_*.py
id: b_l3_conv2d_batch_norm_scaling
level: L3
domain: fuse
difficulty: hard
op_name: conv2d_batch_norm_scaling
title: 'Conv2d + BatchNorm2d (batch stats) + scale: fused CUDA model -> MUSA kernels'
source:
  repo: https://github.com/wzzll123/MultiKernelBench.git
  commit: 460a972c9be7ce18035984321d38b910e27df95f
  license: MIT
  source_files:
  - reference/fuse/conv2d_batch_norm_scaling.py
  test_files:
  - utils/correctness.py
  - utils/cheating_detection.py
spec: '`reference/fuse/conv2d_batch_norm_scaling.py` is the upstream operator

  contract: `nn.Conv2d(8, 64, 3)` on a (128, 8, 128, 128) float32 input,

  then `nn.BatchNorm2d(64)` in training mode (per-channel mean and biased

  variance over N*H*W, eps=1e-5, affine weight/bias), then a multiply by

  the scaling factor (2.0).  The model is constructed from

  `get_init_inputs() = [8, 64, 3, 2.0]` and the evaluator re-seeds before

  constructing `ModelNew`, so an `nn.Conv2d` parameter container with the

  same shape gets the same weights.


  Write `work/submission/conv2d_batch_norm_scaling_submission.py` defining

  `class ModelNew` whose `forward` calls custom MUSA kernels built with

  `load_inline(..., musa_sources=...)`.  The embedded source must declare

  `__global__` kernels and launch them with `<<<...>>>`; do not fall back

  to `muDNN`/`torch.nn.Conv2d` or `torch.nn.functional.batch_norm` for the

  operator body and do not reuse `Model`.


  Precision: this torch_musa build enables muDNN TF32 by default, so the

  reference `nn.Conv2d` is ~5e-4 off exact fp32.  Set

  `torch.backends.mudnn.allow_tf32 = False` at module level and compute the

  convolution in fp32; the harness compares at atol=rtol=1e-4.


  The evaluator (`eval_single_runner.py --language musa`) runs the

  reference and `ModelNew` on `musa:0`.

  '
hidden_tests:
  command: cd {work} && python3 eval_single_runner.py --input {work}/submission/conv2d_batch_norm_scaling_submission.py
    --op conv2d_batch_norm_scaling --language musa --result {build}/result.json && python3 {root}/harness/check_result.py
    {build}/result.json --require-compiled --require-correct --forbid-cheating && python3 {root}/harness/check_musa_submission.py
    {work}/submission/conv2d_batch_norm_scaling_submission.py
task_id: b_l3_conv2d_batch_norm_scaling
