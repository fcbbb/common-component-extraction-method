scenario: cuda_to_musa
fit: B
counted: true
layout: repo
gold_kind: benchmark-judge
source_kind: upstream-kernel-benchmark
tolerances: {}
target:
  gpu: mtt-s4000
  backend: musa-sdk-5.2.0
  toolchain: mcc
  arch: x86_64
gates:
  build: the upstream evaluator imports the submission and builds its MUSA extension on musa:0
  api_removal:
    source_dirs:
    - submission
    source_regex: torch\.cuda|\.cuda\(\)|cuda[A-Z]\w*\s*\(|#include\s*[<"]cuda|#include\s*[<"]cublas|#include\s*[<"]cudnn|#include\s*[<"]cufft|\bnvcc\b|\bcublas[A-Za-z0-9_]*\s*\(|\bcudnn[A-Za-z0-9_]*\s*\(|\bcufft[A-Za-z0-9_]*\s*\(|device\s*=\s*['"]cuda|\bCUDA_[A-Z0-9_]+|__CUDACC__
    exclude_globs: []
  behavior: upstream numerical reference matches within atol=rtol=1e-4
build:
  mode: none
  command: ''
  artifact: ''
prepare:
  remove_globs:
  - prompts/musa_new_model_*.py
  remove:
  - prompts/musa_new_model_leaky_relu.py
id: b_l1_leaky_relu
level: L1
domain: activation
difficulty: easy
op_name: leaky_relu
title: 'MultiKernelBench leaky_relu: CUDA model -> MUSA kernel'
source:
  repo: https://github.com/wzzll123/MultiKernelBench.git
  commit: 460a972c9be7ce18035984321d38b910e27df95f
  license: MIT
  source_files:
  - prompts/cuda_model_leaky_relu.py
  - reference/activation/leaky_relu.py
  gold_files:
  - prompts/musa_new_model_leaky_relu.py
  test_files:
  - utils/correctness.py
  - utils/cheating_detection.py
spec: '`prompts/cuda_model_leaky_relu.py` is the CUDA sample upstream ships;

  `reference/activation/leaky_relu.py` defines `Model`, `get_inputs` and

  `get_init_inputs` and is the numerical contract.  The upstream MUSA

  sample has been removed from `work/` and kept in `gold/`.


  Write `work/submission/leaky_relu_submission.py` defining

  `class ModelNew` whose `forward` calls a custom MUSA kernel.  Build the

  kernel with `torch_musa.utils.musa_extension.load_inline(...,

  musa_sources=...)`; the embedded source must declare `__global__`

  kernels and launch them with `<<<...>>>`.  Do not call PyTorch compute

  ops for the operator body and do not reuse the reference `Model`.


  The evaluator (`eval_single_runner.py --language musa`) executes the

  reference and `ModelNew` on `musa:0`, compares five trials with

  atol=rtol=1e-4, then times `ModelNew`.

  '
hidden_tests:
  command: cd {work} && python3 eval_single_runner.py --input {work}/submission/leaky_relu_submission.py
    --op leaky_relu --language musa --result {build}/result.json && python3 {root}/harness/check_result.py
    {build}/result.json --require-compiled --require-correct --forbid-cheating && python3 {root}/harness/check_musa_submission.py
    {work}/submission/leaky_relu_submission.py
task_id: b_l1_leaky_relu
