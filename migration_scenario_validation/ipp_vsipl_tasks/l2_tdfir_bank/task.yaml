# Task package: time-domain FIR filter bank (HPEC TDFIR kernel, reduced).
# Source state = src/tdfir_ipp.c (Intel IPP).  Target = VSIPL C (jvsip).
task_id: l2_tdfir_bank
scenario: ipp_to_vsipl
source_kind: vendored-ipp-snapshot
gold_kind: implementation
level: L2
domain: radar
difficulty: medium
fit: B            # no single VSIPL call reproduces ippsFIRSR state handling

source:
  repo: hpce-challenge/tdfir            # synthetic reduction of the HPEC TDFIR kernel
  commit: "synthetic-2026-11-14"
  license: synthetic
  vendored: true
  files:
    - src/tdfir_ipp.c
    - include/tdfir.h
    - CMakeLists.txt
  loc: 100
  ipp_apis:
    - ippsFIRSRGetSize
    - ippsFIRSRInit_32f
    - ippsFIRSR_32f
    - ippsMalloc_8u
    - ippsMalloc_32f
    - ippsFree
    - ippsZero_32f
  note: >-
    ippsFIRSR_32f carries the delay line as pDlySrc/pDlyDst; the migrated code
    must reproduce that state carry-over across calls by other means.

target:
  api: VSIPL                   # VSIPL 1.3 C, jvsip implementation
  library: jvsip
  allowed_extra_libs: [libm]   # VSIPL only; no IPP, no FFTW

spec: |
  src/tdfir_ipp.c implements a bank of `nfilters` FIR filters over a
  continuous block-based stream.  Migrate it to VSIPL (jvsip, VSIPL 1.3 C)
  while keeping include/tdfir.h and the observable behaviour unchanged:

  - out[m * n + i] is filter m applied to in[i], with coefficients
    taps[m * ntaps .. m * ntaps + ntaps - 1];
  - every tdfir_process() call consumes exactly `block` samples, and
    consecutive calls continue the same stream (state carry-over);
  - the first block behaves as if preceded by ntaps-1 zeros;
  - tdfir_create/tdfir_destroy keep their signatures and must free
    everything they allocate;
  - no ipps*/ippi* symbol may remain in the built artifact.

  The library to target is jvsip (rrjudd/jvsip).  Note that jvsip's
  vsip_firflt_f() is not usable (it builds its overlap view on the kernel
  block); implement the filter with primitives that work, e.g. vsip_vdot_f
  over an extended input buffer, or vsip_conv1d/conv1d_create_f.  If you take
  a subview, release it with vsip_vdestroy_f(), not vsip_valldestroy_f() —
  the latter destroys the parent block.

prepare:
  mode: vendored
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j'
  artifact: '{build}/libtdfir.a'
  baseline_command: "cmake -S . -B build -DUSE_IPP=ON -DIPP_ROOT=$IPP_ROOT && cmake --build build -j"

public_tests:
  command: 'ctest --test-dir {build} --output-on-failure'
  visible_to_agent: true
  note: >-
    public_test.c only checks a small impulse-response case against a
    direct-form reference written in the test itself.

hidden_tests:
  command: 'python3 {root}/harness/run_hidden.py --task-root . --task-id l2_tdfir_bank --harness-dir {root}/harness --golden {golden} --build-dir {build}/hidden'
  golden: "IPP build of the original source (golden_gen), 5 cases"
  visible_to_agent: false
  cases:
    - {ntaps: 10,  nfilters: 4, block: 1024, nblocks: 1}
    - {ntaps: 101, nfilters: 2, block: 1024, nblocks: 4}
    - {ntaps: 1,   nfilters: 1, block: 7,    nblocks: 1}
    - {ntaps: 64,  nfilters: 8, block: 1,    nblocks: 5}
    - {ntaps: 33,  nfilters: 3, block: 200,  nblocks: 5}

tolerances:
  float32: {rtol: 1.0e-4, atol: 1.0e-6}
  float64: {rtol: 1.0e-12, atol: 1.0e-14}

gates:
  build: "must configure and build with no IPP include path"
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libtdfir.a'
  behavior: 'hidden_test exits 0 on every golden case; no IPP symbol remains in the built artifact'
  numeric: "hidden_test exits 0 (all 5 cases within tolerance)"

gold_patch: gold/tdfir_vsipl.c
gold_notes: >-
  Verified reference: 5/5 cases, worst relative error 2.8e-6 on the 101-tap
  case.  Uses vsip_vdot_f over an extended buffer because jvsip's
  vsip_firflt_f() segfaults; subviews are freed with vsip_vdestroy_f() because
  vsip_valldestroy_f() on a subview frees the parent block.
