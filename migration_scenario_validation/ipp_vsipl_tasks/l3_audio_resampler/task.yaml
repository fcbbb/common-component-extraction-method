# Task package: streaming sample-rate converter + output analyser (synthetic).
# Source state = src/resampler_ipp.c + include/resampler.h (Intel IPP).
# Target = VSIPL C (jvsip).
task_id: l3_audio_resampler
scenario: ipp_to_vsipl
source_kind: vendored-ipp-snapshot
gold_kind: implementation
level: L3
domain: resample
difficulty: hard
fit: B            # IPP supplies the two kernels this needs (a dot product per
                  # output sample, a real FFT per analysis frame) and nothing
                  # else; VSIPL supplies the same two as primitives plus the
                  # vector reductions, so the candidate has to hold the
                  # streaming bookkeeping, the polyphase layout and the frame
                  # loop together across three entry points

source:
  repo: "synthetic (audio front-end: sample-rate conversion then a periodogram)"
  commit: "-"
  license: synthetic
  vendored: true
  files:
    - include/resampler.h                 # 85 lines, the whole contract
    - src/resampler_ipp.c                 # 349 lines, the component
  loc: 434
  note: >-
    A rational polyphase interpolator/decimator in the shape of an
    audio-resampling front-end, followed by a periodogram of the converted
    stream ("did the conversion leave an image behind").  The prototype filter
    is defined in the header rather than taken from a library -- that is
    deliberate: ippsResamplePolyphaseFixed_32f cannot be reproduced from its
    own documentation, so a package built on it would have no reproducible
    golden, and task 17 carries a scope note saying so.  Here the filter is
    specified in closed form and IPP is used only for what it does
    reproducibly: the per-output dot product and the transform.
  scope_note: >-
    This is a *stateful* package, unlike task 18: the conversion is defined per
    output index over the whole stream, so the output of a session must not
    depend on how the caller blocks the input.  Three of the eight hidden cases
    feed one sample at a time, 13 at a time and 147 at a time precisely to make
    that binding.  What makes it L3 besides the state is that four separate
    index conventions have to survive at once: the m -> (i, p) map, the window
    the dot product walks (time-reversed taps), the frame segmentation of the
    analyser, and the fact that the analyser gets the *converted* stream, not
    the input.
  ipp_apis:
    - ippsFFTGetSize_R_32f
    - ippsFFTInit_R_32f
    - ippsFFTFwd_RToCCS_32f
    - ippsDotProd_32f
    - ippsCopy_32f
    - ippsMagnitude_32fc
    - ippsSqr_32f
    - ippsAdd_32f
    - ippsMulC_32f
    - ippsMaxIndx_32f
    - ippsSum_32f
    - ippsMalloc_8u

target:
  api: VSIPL                   # VSIPL 1.3 C, jvsip implementation
  library: jvsip
  allowed_extra_libs: [libm]

spec: |
  src/resampler_ipp.c implements the converter and the analyser on top of Intel
  IPP.  Migrate it off IPP while keeping include/resampler.h and every
  observable behaviour unchanged.  The header is the contract; it also *defines*
  the prototype filter, so the numbers are reproducible from it alone:

  L  = up*ntaps
      c  = (L-1)/2
      h[j]      = 2*fc*sinc(2*fc*(j-c)) * 0.5*(1 - cos(2*pi*j/(L-1)))
      hp[p][k]  = h[p + k*up] / sum_k' h[p + k'*up]        (branch sums to 1)

  Configuration: res_config{up, down, ntaps, cutoff, fft_len}; 1 <= up,down <=
  256, ntaps >= 2, 0 < cutoff < 0.5, fft_len a power of two >= 8.  res_create()
  returns NULL for a NULL config or a rejected configuration.

  Conversion, for output index m = 0, 1, 2, ...:
      num = m*down;  i = num/up;  p = num%up
      y[m] = sum_{k=0}^{ntaps-1} hp[p][k] * x[i-k]
  Output m exists once sample i has been consumed and i >= ntaps-1, so the
  number of outputs depends only on the total input consumed so far and never
  on how it was blocked.  res_process() returns the number of samples written
  (0 for nin == 0), and returns -1 having consumed nothing when cap is smaller
  than res_max_out(st, nin).  res_max_out() is an upper bound on the outputs
  nin samples can produce.  The history and the next output index carry across
  calls.

  Analysis of the converted stream, non-overlapping frames of fft_len samples,
  rectangular window, unscaled transform:
      nframes = (n >= N) ? 1 + (n-N)/N : 0
      mag2[k] = (1/nframes) * sum_f |FFT_N(y_f)[k]|^2,  k = 0 .. N/2
      power = max_k mag2[k];  power_bin = the first maximum
      total = sum_k mag2[k];  centroid = sum_k k*mag2[k] / total  (0 if total==0)
  res_spectrum() returns nframes and fills nbins; with n < fft_len it returns 0
  and leaves mag2 and rep untouched.  A NULL state, input, density or report
  returns -1.

  no ipp*/ippi*/ippvm*/ippcore symbol may remain in the built artifact.
prepare:
  mode: vendored
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libresampler.a'
  baseline_command: "cmake -S . -B build -DUSE_IPP=ON -DIPP_ROOT=$IPP_ROOT && cmake --build build -j"

public_tests:
  command: 'ctest --test-dir {build} --output-on-failure'
  visible_to_agent: true
  note: >-
    public_test.c (34 checks) computes the whole session in double -- the
    prototype, both branch sets, the m -> (i,p) map and the convolution sum --
    for five ratios, and compares count and every sample.  It then pins the
    streaming invariant from the other side: the same 600 samples fed whole, one
    at a time and seven at a time must produce the identical stream, and two
    states driven interleaved must not disturb each other.  The analyser is
    checked against a direct double DFT of the same stream (frame count,
    density, peak bin, peak, total, centroid, nbins), and the edges are pinned:
    nin == 0, n < fft_len leaving mag2 untouched, a too-small capacity, the
    NULL arguments, res_max_out(NULL), the NULL config and rejected
    configurations.  It never calls into IPP and never uses a golden container.

hidden_tests:
  command: 'python3 {root}/harness/run_hidden.py --task-root . --task-id l3_audio_resampler --harness-dir {root}/harness --golden {golden} --build-dir {build}/hidden'
  golden: "IPP build of the original source (golden_gen), 8 cases"
  visible_to_agent: false
  cases:
    - 2/1, 8 taps, fc 0.45, N 256, 600 in, one block (upsampling)
    - 1/2, 8 taps, fc 0.45, N 256, 600 in, blocks of 37 (decimation)
    - 160/147, 12 taps, fc 0.45, N 512, 1470 in, blocks of 147 (large ratio)
    - 3/2, 6 taps, fc 0.40, N 128, 300 in, one sample per call
    - 5/4, 16 taps, fc 0.35, N 256, 400 in, blocks of 64
    - 1/1, 4 taps, fc 0.49, N 64, 500 in, blocks of 13 (identity ratio)
    - 7/3, 10 taps, fc 0.30, N 128, 700 in, one block (non-integer ratio)
    - 2/3, 9 taps, fc 0.42, N 64, 333 in, blocks of 50 (ragged tail)
  note: >-
    Each container carries the configuration, the input capture, the baseline's
    complete converted stream, its periodogram and the four report fields.  The
    signals are deterministic three-tone-plus-noise captures with a per-case
    seed, scaled to 0.9; golden_gen refuses to emit a case whose spectral peak
    is within 1e-4 of the runner-up, so power_bin is safe to compare exactly.
    The blocking is part of the case: case 3 is the one that catches a state
    that forgets the phase or the history between calls, and case 2 is the one
    whose 257-bin aggregate exposes the summation-order budget (see tolerances).

tolerances:
  float32: {rtol: 1.0e-5, atol: 0.0, mode: peak-relative, floor: 1.0}
  aggregates: {rtol: 1.0e-4, applies_to: [total, centroid]}
  power_bin: {mode: exact}
  nout/nbins: {mode: exact}
  note: >-
    Reference migration matches IPP to 6.0e-07 worst relative on the element-
    wise quantities (every stream sample, every density bin, power), and to
    1.44e-05 on `total` in the 512-point case.  The aggregate budget is not
    slack: adding 257 floats carries O(nbin*eps) ~ 3e-5 of order-dependent
    rounding, and the *same* IPP code observed the same 1.44e-05 swing between
    processes with different buffer alignment before the baseline was pinned to
    ippAlgHintNone.  Holding a sum to the element-wise tolerance would make the
    hidden set flaky, so total and centroid are compared at 1e-4 -- still far
    below the factor-of-two or factor-of-N mistakes a wrong normalization makes.
    Everything element-wise stays at 1e-5: an off-by-one in the window, a
    missing Nyquist slot, a phase error or a dropped history sample is O(1) on
    the affected samples.

gates:
  build: "must configure and build with no IPP include path"
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libresampler.a'
  behavior: 'hidden_test exits 0 on every golden case; no IPP symbol remains in the built artifact'
  numeric: "hidden_test exits 0 (all 8 cases within tolerance)"

gold_patch: gold/resampler_vsipl.c
gold_notes: >-
  Verified reference: 8/8 cases, worst relative error 1.436e-05 (aggregate;
  5.98e-07 element-wise), public test 34/34, API gate clean, ASan/UBSan clean.
  Mapping: the prototype and the realloc-able history stay plain C (the filter
  is defined by the header, and memmove over a malloc'd plane is not something
  VSIPL is meant to help with); the branch filter is one vsip_vdot_f between a
  vsip_vbind_f over the taps and a vsip_vbind_f over hist[i-ntaps+1 .. i]; each
  analysis frame is a view bound at f*fft_len over the caller's buffer, copied
  with vsip_vcopy_f_f, transformed with vsip_rcfftop_f (scale 1.0), converted
  with vsip_cvmag_f + vsip_vsq_f, accumulated with vsip_vadd_f and scaled with
  vsip_svmul_f; the report is vsip_vmaxval_f, vsip_vsumval_f and
  vsip_vdot_f(ramp, acc); zeroing is vsip_vfill_f.  The IPP artifact fails the
  API gate with 12 symbols: ippsAdd_32f ippsCopy_32f ippsDotProd_32f
  ippsFFTFwd_RToCCS_32f ippsFFTGetSize_R_32f ippsFFTInit_R_32f
  ippsMagnitude_32fc ippsMalloc_8u ippsMaxIndx_32f ippsMulC_32f ippsSqr_32f
  ippsSum_32f.
  Things worth knowing, all of which cost time here:
  (1) The IPP CCS block of a length-N real transform is N+2 floats, with
  Re X[N/2] at p[N], not N -- the same trap as task 18.  The migration is where
  it disappears: vsip_rcfftop_f writes the natural sequence, so
  vsip_cvmag_f applies to all fft_len/2+1 bins with no special case.  A
  candidate that carries the packed indexing across produces a Nyquist-only
  error, which the peak-relative comparison catches on the 512-point case.
  (2) Time-reversing the taps is what makes one ascending dot product equal to
  the contract's sum; leaving them in natural order still gives a plausible
  waveform (the filter is nearly symmetric) and only the direct-sum public test
  and the hidden stream find it.
  (3) The history plane is grown with realloc as the session runs.  Two rules
  follow: ippsMalloc_8u pointers cannot be handed to realloc (the baseline uses
  plain malloc/free for that plane and keeps ippsMalloc for the fixed IPP
  buffers), and any block bound over the plane must be destroyed and bound
  again when realloc moves it.  vsip_blockdestroy_f is safe there because a
  block from vsip_blockbind_f is VSIP_USER_BLOCK and does not free the array
  (only vsip_blockcreate_f blocks do).  Binding a block over a plane and
  forgetting the rebind reads a freed buffer -- ASan is the only thing that
  sees it, because the freed copy still holds the old samples.
  (4) `total` is the one quantity that cannot be compared at the element-wise
  tolerance: a float sum over up to 257 bins, accumulated in a different order
  by the two libraries.  It was the only failure when the hidden test was
  written (1.436e-05 on case 2, tolerance 1e-5), and the same swing showed up
  between two runs of the *baseline* under ippAlgHintFast.  Fixed on both
  sides: the baseline sums with ippAlgHintNone (documented in the source --
  Fast splits its SIMD tail by buffer alignment, so the value is not stable
  across processes), and the hidden test compares total and centroid at 1e-4.
  (5) Zeroing the accumulation view with vsip_svmul_f(0.0f, acc, acc) reads the
  fresh plane; a leftover inf/NaN bit pattern becomes NaN and poisons every
  later statistic.  vsip_vfill_f is the memset-like operation.  The hidden test
  writes every comparison as `!(r <= tol)` so a NaN counts as a failure rather
  than passing the `r > tol` form.
  (6) jvsip's vsip_cvmag_f computes the magnitude as s*|...| with s = |re|+|im|
  rather than a straight sqrt(re^2+im^2); the two differ only in rounding (well
  under the tolerance here), but it is the reason the element-wise error sits
  in the 1e-7 range rather than the 1e-8 range.
  (7) The analyser is a second, independent contract: rectangular window (no
  vsip_vcreate_hanning_f), non-overlapping frames, unscaled transform, and it
  consumes the *converted* stream.  The frame count is 1+(n-N)/N, i.e. the
  partial trailing frame is dropped rather than padded -- the 216-sample stream
  of the last case gives 3 frames at N=64, not 4, and counting it would scale
  the whole density by 3/4.
