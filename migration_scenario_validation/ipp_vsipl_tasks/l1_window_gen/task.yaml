# Task package: symmetric analysis windows (Hann/Hamming/Blackman/Kaiser).
# Source state = src/win_ipp.c (Intel IPP).  Target = VSIPL C (jvsip).
task_id: l1_window_gen
scenario: ipp_to_vsipl
source_kind: vendored-ipp-snapshot
gold_kind: implementation
level: L1
domain: generic
difficulty: medium
fit: B            # VSIPL's window generators exist but none matches IPP

source:
  repo: synthetic/dsp-frontend    # synthetic repo, the windowing stage of a
                                  # generic spectral front end
  commit: "synthetic-2026-11-14"
  license: synthetic
  vendored: true
  files:
    - src/win_ipp.c
    - include/win_gen.h
    - CMakeLists.txt
  loc: 120
  ipp_apis:
    - ippsWinHann_32f
    - ippsWinHamming_32f
    - ippsWinBlackman_32f
    - ippsWinKaiser_32f
  note: >-
    IPP 2021 exposes the windows as "apply to a signal" calls (pSrc, pDst,
    length), with no symmetric/periodic flag: all four are symmetric, with the
    phase 2*pi*i/(n-1).  Three conventions were pinned down empirically:
    (1) Blackman uses w = (0.5 + a/2) - 0.5cos(t) - (a/2)cos(2t), i.e. the sign
    of the textbook alpha/2 term is flipped; (2) Kaiser's alpha is expressed in
    samples, beta = alpha*(n-1)/2; (3) Kaiser rejects beta > 38 with
    ippStsHugeWinErr ("Kaiser window is too big") and Hann/Hamming/Blackman
    reject n < 3 with ippStsSizeErr.

target:
  api: VSIPL                   # VSIPL 1.3 C, jvsip implementation
  library: jvsip
  allowed_extra_libs: [libm]

spec: |
  src/win_ipp.c applies one of four symmetric windows to a signal.  Migrate it
  off Intel IPP while keeping include/win_gen.h and the observable behaviour
  unchanged:

  - win_apply(type, param, in, out, n) writes out[i] = in[i] * w[i];
  - HANN, HAMMING, BLACKMAN: symmetric (2*pi*i/(n-1)), require n >= 3;
  - BLACKMAN uses  w = (0.5 + a/2) - 0.5cos(t) - (a/2)cos(2t);
  - KAISER: w = I0(b*sqrt(1-(2i/(n-1)-1)^2)) / I0(b) with b = param*(n-1)/2,
    accepts any n >= 1, and requires b <= 38;
  - return 0 on success, -1 on invalid arguments;
  - no ipps*/ippi* symbol may remain in the built artifact.
prepare:
  mode: vendored
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libwingen.a'
  baseline_command: "cmake -S . -B build -DUSE_IPP=ON -DIPP_ROOT=$IPP_ROOT && cmake --build build -j"

public_tests:
  command: 'ctest --test-dir {build} --output-on-failure'
  visible_to_agent: true
  note: >-
    public_test.c recomputes all four windows in double precision for n=33,
    checks left/right symmetry of every window, the Hann zero endpoints and
    the Hamming 0.08 endpoint, the Kaiser n=1 identity, and the rejection of
    n < 3 / negative alpha / beta > 38 / unknown types.

hidden_tests:
  command: 'python3 {root}/harness/run_hidden.py --task-root . --task-id l1_window_gen --harness-dir {root}/harness --golden {golden} --build-dir {build}/hidden'
  golden: "IPP build of the original source (golden_gen), 9 cases"
  visible_to_agent: false
  cases:
    - {type: hann,     param: 0.00, n: 1024}
    - {type: hamming,  param: 0.00, n: 64}
    - {type: blackman, param: 0.16, n: 257}
    - {type: blackman, param: 0.30, n: 8}    # peak exceeds 1
    - {type: kaiser,   param: 5.00, n: 16}   # beta = 37.5, near the limit
    - {type: kaiser,   param: 0.50, n: 16}
    - {type: hann,     param: 0.00, n: 3}    # smallest accepted length
    - {type: kaiser,   param: 1.00, n: 77}   # beta = 38.0 exactly
    - {type: kaiser,   param: 7.00, n: 1}    # single sample

tolerances:
  float32: {rtol: 1.0e-4, atol: 1.0e-5}
  note: >-
    Reference migration matches IPP to 1.4e-6 worst relative.  The Hann and
    Hamming cases come out bit-identical (both sides evaluate the same
    double-precision cosine), so a wrong convention shows up as O(1) error at
    the interior samples, not as rounding.

gates:
  build: "must configure and build with no IPP include path"
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libwingen.a'
  behavior: 'hidden_test exits 0 on every golden case; no IPP symbol remains in the built artifact'
  numeric: "hidden_test exits 0 (all 9 cases within tolerance)"

gold_patch: gold/win_vsipl.c
gold_notes: >-
  Verified reference: 9/9 cases, worst relative error 1.4e-6.  The windows are
  evaluated in double precision and written into a VSIPL-owned view; the
  product with the bound input view is vsip_vmul_f.
