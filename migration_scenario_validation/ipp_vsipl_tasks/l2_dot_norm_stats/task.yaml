# Task package: sliding-window summary statistics.
# Source state = src/stats_ipp.c (Intel IPP).  Target = VSIPL C (jvsip).
task_id: l2_dot_norm_stats
scenario: ipp_to_vsipl
source_kind: vendored-ipp-snapshot
gold_kind: implementation
level: L2
domain: generic
difficulty: easy
fit: A            # one VSIPL reduction per IPP call; only stddev is composed

source:
  repo: synthetic/generic-dsp      # synthetic repo, the kind of summary stage
                                   # that sits between a detector and a tracker
  commit: "synthetic-2026-11-14"
  license: synthetic
  vendored: true
  files:
    - src/stats_ipp.c
    - include/stats.h
    - CMakeLists.txt
  loc: 150
  ipp_apis:
    - ippsDotProd_32f
    - ippsNorm_L2_32f
    - ippsMean_32f
    - ippsStdDev_32f
    - ippsMax_32f
    - ippsMin_32f
    - ippsMalloc_32f
    - ippsFree
  note: >-
    IPP has no strided vector primitives (checked in ipps.h: only the
    contiguous *_32f forms exist), so the source gathers a decimated window
    into two scratch buffers before calling the kernels.  Two kernel
    behaviours are part of the contract: ippsStdDev_32f uses the sample (n-1)
    denominator and fails with ippStsSizeErr for n == 1 (the wrapper defines
    that case as 0); ippsMax_32f / ippsMin_32f ignore NaN samples while
    norm/mean/dot propagate it.

target:
  api: VSIPL                   # VSIPL 1.3 C, jvsip implementation
  library: jvsip
  allowed_extra_libs: [libm]

spec: |
  src/stats_ipp.c summarises a window of two streams.  Migrate it off Intel
  IPP while keeping include/stats.h and the observable behaviour unchanged:

  - dsp_summary_compute(a, b, n, out)        contiguous window a[0..n)
  - dsp_summary_compute_strided(a, astride, b, bstride, offset, n, out)
                                             sample i is a[offset + i*astride]
                                             and b[offset + i*bstride]
  - out->dot    = sum a[i]*b[i]
  - out->norm   = sqrt(sum a[i]^2)
  - out->mean   = mean of a
  - out->stddev = sqrt(sum (a[i]-mean)^2 / (n-1)); 0 when n == 1
  - out->vmax / out->vmin: NaN samples ignored, +-Inf are ordinary values
  - return 0 on success, -1 for NULL pointers, n < 1, stride < 1, offset < 0
  - no ipps*/ippi* symbol may remain in the built artifact

  This is the task where VSIPL is strictly better than IPP: bind the caller's
  buffer once (vsip_blockbind_f + vsip_blockadmit_f) and slice it with
  vsip_vbind_f(block, offset, stride, n).  The strided window then costs
  nothing -- no gather, no scratch buffer.  vsip_vmeanval_f, vsip_vdot_f,
  vsip_vsumsqval_f, vsip_vmaxval_f and vsip_vminval_f each do one statistic;
  stddev is the only composition (vsip_svsub_f of the mean, then
  vsip_vsumsqval_f).

  Note that the reference still calls vsip_blockrelease_f + vsip_blockdestroy_f
  on the bound block: jvsip's blockdestroy only frees the data array for blocks
  VSIPL allocated itself, so the caller's memory is never touched.

prepare:
  mode: vendored
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libstats.a'
  baseline_command: "cmake -S . -B build -DUSE_IPP=ON -DIPP_ROOT=$IPP_ROOT && cmake --build build -j"

public_tests:
  command: 'ctest --test-dir {build} --output-on-failure'
  visible_to_agent: true
  note: >-
    public_test.c recomputes every field in double precision from the
    definitions for one contiguous and one decimated window (astride 2,
    bstride 3 -- different strides, shared offset), checks the n == 1 case,
    and checks that invalid arguments return -1.

hidden_tests:
  command: 'python3 {root}/harness/run_hidden.py --task-root . --task-id l2_dot_norm_stats --harness-dir {root}/harness --golden {golden} --build-dir {build}/hidden'
  golden: "IPP build of the original source (golden_gen), 6 cases"
  visible_to_agent: false
  cases:
    - {n: 512, astride: 1, bstride: 1, offset: 0, nan: none}   # contiguous
    - {n: 513, astride: 3, bstride: 1, offset: 2, nan: none}   # decimated a
    - {n: 1,   astride: 1, bstride: 1, offset: 5, nan: none}   # single sample
    - {n: 257, astride: 2, bstride: 4, offset: 1, nan: none}   # both decimated
    - {n: 300, astride: 1, bstride: 1, offset: 0, nan: idx 100} # NaN sample
    - {n: 64,  astride: 4, bstride: 2, offset: 3, nan: none}   # short window
  note: >-
    The NaN case masks the stddev field: ippsStdDev_32f returns 0 when the
    window contains NaN, which is not a value worth reproducing, so that case
    is scored on dot/norm/mean/vmax/vmin (all NaN or NaN-skip behaviour that a
    VSIPL view reproduces exactly).  All other fields on all cases are scored.

tolerances:
  float32: {rtol: 1.0e-4, atol: 1.0e-5}
  note: >-
    Reference migration matches IPP to 4.2e-7 worst relative across the six
    cases.  Sending the wrong stride/offset to vsip_vbind_f shifts the window
    and produces O(1) differences, so the strided cases fail loudly.

gates:
  build: "must configure and build with no IPP include path"
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libstats.a'
  behavior: 'hidden_test exits 0 on every golden case; no IPP symbol remains in the built artifact'
  numeric: "hidden_test exits 0 (all 6 cases within tolerance)"

gold_patch: gold/stats_vsipl.c
gold_notes: >-
  Verified reference: 6/6 cases, worst relative error 4.2e-7.  Views are bound
  onto the caller's buffers with the caller's stride and offset; stddev is
  vsip_svsub_f + vsip_vsumsqval_f on a VSIPL-owned scratch view.
