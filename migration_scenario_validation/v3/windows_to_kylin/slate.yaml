# Windows -> Kylin V3 task slate.
#
# Split unit is the repository, not the task: a repository may appear only on
# one side of library_source / pilot / held_out.  See SPLIT.md for the rationale.
#
# library_source tasks are the corpus the transformation components were built
# from.  They are never evaluated.  pilot tasks may be run for prompt work but
# are not blind.  held_out tasks are the test set.

scenario: windows_to_kylin
split_unit: repository

split:
  library_source:
    repos:
      - libuv
      - libarchive
    tasks:
      - l2_libuv_fs
      - l2_libuv_process
      - l2_libuv_thread
      - l2_libarchive_read_disk
      - l2_libarchive_write_disk
  pilot:
    repos:
      - libgit2
    tasks:
      - v2_libgit2_util_full
  held_out:
    repos:
      - POCO
      - nginx
      - curl
      - opencv
    tasks:
      - v2_file
      - v3_poco_fs_stack
      - v2_path
      - v2_thread
      - v2_rwlock_semaphore
      - v2_shared_library
      - v2_foundation_full
      - v2_poco_process
      - negative_win32_eventlog
      - v2_nginx_files
      - v2_nginx_full
      - v2_nginx_process
      - v2_nginx_thread
      - v2_curl_build
      - v2_curl_tls
      - v2_curl_thread
      - v2_curl_file
      - l2_opencv_highgui
  separate:
    repos:
      - synthetic
    tasks:
      - synthetic_multi_call_site
      - synthetic_posix_fs_requests
      - synthetic_spawn_event_loop
      - synthetic_thread_runtime
  reporting:
    core:
      - v2_file
      - v3_poco_fs_stack
      - v2_path
      - v2_thread
      - v2_rwlock_semaphore
      - v2_foundation_full
      - v2_poco_process
      - v2_nginx_files
      - v2_nginx_full
      - v2_nginx_process
      - v2_nginx_thread
      - v2_curl_build
      - v2_curl_thread
      - v2_curl_file
    boundary:
      - v2_shared_library
      - v2_curl_tls
      - l2_opencv_highgui
    negative:
      - negative_win32_eventlog
    synthetic:
      - synthetic_multi_call_site
      - synthetic_posix_fs_requests
      - synthetic_spawn_event_loop
      - synthetic_thread_runtime
  excluded:
    repos: []
    tasks:
      - v2_libgit2_file
      - v2_libgit2_process
      - l2_libgit2_file
      - l2_libgit2_process
      - l3_libgit2_full
    reason: >-
      libgit2_file / libgit2_process are subsets of the pilot task
      v2_libgit2_util_full; the v1 entries are the same migrations.

rules:
  - A repository in library_source must not appear in held_out.
  - The pilot repository is excluded from every pass-rate statistic.
  - From this pre-registration onward, a task listed in a component's source_migrations is permanently out of the test set.
  - Tasks from the same repository are clustered, not independent samples.
  - v1 and v2 packages of the same repository/commit/migration surface count once.
  - Boundary tasks are reported separately from the core component coverage.
  - The negative control is excluded from pass rate and scored on the report itself.
  - The synthetic task is reported separately from upstream repositories.

defaults:
  scenario: windows_to_kylin
  fit: B
  counted: true
  task_family: v3
  library_manifest: v3/windows_to_kylin/library/manifest.json
  source_kind: upstream_platform_port

