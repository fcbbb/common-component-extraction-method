scenario: windows_to_kylin
task_family: v3
family: nginx_os
fit: B
counted: true
source_kind: upstream_platform_port
gold_kind: implementation
library_manifest: v3/windows_to_kylin/library_generated/full_20261123/library/manifest.json
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: 3.16.5
build:
  command: ./auto/configure --prefix={build}/nginx --with-threads --without-http_rewrite_module
    --without-http_gzip_module && make -j
  artifact: '{work}/objs/nginx'
gates:
  build: configure and build nginx with --with-threads on the target platform
  api_removal:
    symbol_regex: ^(__imp_|CreateThread|WaitForSingleObject|EnterCriticalSection|LeaveCriticalSection|InitializeCriticalSection|DeleteCriticalSection|SleepConditionVariableCS|SleepConditionVariableSRW|WakeConditionVariable|WakeAllConditionVariable|CreateEventA|CreateEventW|CloseHandle|GetCurrentThreadId)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateThread|WaitForSingleObject|EnterCriticalSection|LeaveCriticalSection|InitializeCriticalSection|DeleteCriticalSection|SleepConditionVariable|WakeConditionVariable|WakeAllConditionVariable|CreateEvent|CloseHandle|GetCurrentThreadId
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - src/os/unix/ngx_thread_mutex.c
    - src/os/unix/ngx_thread_cond.c
    - src/os/unix/ngx_thread_id.c
  target_api: the rebuilt primitives use the target platform's thread, mutex and
    condition-variable facilities instead of a hand-written portable fallback
  behavior: a --with-threads build starts a worker with a live thread pool, serves
    static content through `aio threads`, and the mutex/condition/tid contract holds
    under concurrent use
  regression: the server still builds without threads and serves static content
id: v2_nginx_thread
level: L2
family_type: pattern
sequence: 14
domain: threading
difficulty: hard
title: Migrate the nginx thread primitives to Kylin V10 SP3
source:
  repo: https://github.com/nginx/nginx.git
  commit: 1be0fb0c9f9bc3489c7b40576efd6afe6b2eccd5
  tag: release-1.26.3
  license: BSD-2-Clause
  windows_files:
  - src/os/win32/ngx_thread.c
  - src/os/win32/ngx_thread.h
  gold_files:
  - src/os/unix/ngx_thread_mutex.c
  - src/os/unix/ngx_thread_cond.c
  - src/os/unix/ngx_thread_id.c
  test_files:
  - src/os/unix/ngx_thread.h
  - src/core/ngx_thread_pool.c
spec: |
  nginx is being moved from Windows to Kylin V10 SP3.  The target-platform
  threading primitives used by the thread pool have not been written yet.

  Reimplement the mutex, condition variable and thread-id primitives that
  the core thread pool is built on, keeping the contract declared in
  ngx_thread.h: create/destroy/lock/unlock, create/destroy/signal/wait,
  and a per-thread identifier.  The header, the thread pool, the Win32
  implementation and the configure entry stay visible as the reference.

  Scope: the threading primitives only; do not change the pool, the
  interfaces or the build configuration.  Acceptance: nginx configures
  with --with-threads, the worker runs a live thread pool, static content
  is served through `aio threads`, and the primitive contract holds under
  concurrent use.
prepare:
  remove:
  - src/os/unix/ngx_thread_mutex.c
  - src/os/unix/ngx_thread_cond.c
  - src/os/unix/ngx_thread_id.c
harness:
  scripts:
  - nginx_smoke.sh
  - nginx_thread_probe.sh
  - ngx_thread_sensitivity.c
hidden_tests:
  command: cc -I {work}/src/core -I {work}/src/event -I {work}/src/event/modules
    -I {work}/src/os/unix -I {work}/objs {root}/harness/ngx_thread_sensitivity.c
    $(find {work}/objs -name '*.o' | sort) -ldl -lpthread -lcrypt -Wl,-E -no-pie
    -o {work}/objs/ngx_thread_sensitivity && timeout 120 {work}/objs/ngx_thread_sensitivity
    && bash {root}/harness/nginx_smoke.sh --binary {work}/objs/nginx --port 28084
    && bash {root}/harness/nginx_thread_probe.sh --binary {work}/objs/nginx --port
    28085
task_id: v2_nginx_thread