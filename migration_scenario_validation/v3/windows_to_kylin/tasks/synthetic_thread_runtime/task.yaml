id: synthetic_thread_runtime
level: L3
family_type: synthetic
sequence: 26
domain: threading
difficulty: hard
title: Synthetic portable threading runtime backend
source:
  repo: synthetic://windows-to-posix/thread-runtime
  commit: synthetic-1
  tag: n/a
  license: project-authored
  windows_files:
  - src/win32/thr_win32.c
  gold_files:
  - src/posix/thr_posix.c
  test_files:
  - tests/test_thr.c
spec: |
  A runtime being moved from Windows to Kylin V10 SP3 exposes its threading
  surface through thr.h: thread creation, join, identity and equality; plain
  and recursive mutexes; read/write locks; counting semaphores; condition
  variables with an optional timed wait; thread-local storage with a
  destructor; one-time initialisation; and a process affinity mask.  Every
  object is caller-allocated storage of the size declared in the header, and
  every call reports one of the public THR_* codes.  The Windows reference
  src/win32/thr_win32.c documents the source semantics; the POSIX backend
  src/posix/thr_posix.c is missing.

  The header is the contract.  The backend must implement it on the target
  with the platform's native threading primitives, preserving the source's
  observable thread, synchronisation, storage and affinity semantics.  Join
  clears the identity in the caller's variable, and a cleared identity cannot
  be joined again.  Where the Windows reference relies on Win32 conventions
  that POSIX does not share, follow the target's native conventions rather
  than transliterating the Win32 calls.

  Null output pointers and null guards are invalid wherever the public
  signature takes a pointer.  The port must not change thr.h, the public
  self-test or the Windows reference, and must not add an initialiser that
  callers would have to invoke before using THR_ONCE_INIT.
prepare:
  remove:
  - src/posix/thr_posix.c
harness:
  scripts:
  - thr_probe.sh
hidden_tests:
  command: bash {root}/harness/thr_probe.sh --build {build} --work {work}
task_id: synthetic_thread_runtime