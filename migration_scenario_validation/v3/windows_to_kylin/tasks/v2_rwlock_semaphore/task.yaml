scenario: windows_to_kylin
task_family: v3
family: poco_foundation
fit: B
counted: true
source_kind: library_family_port
gold_kind: implementation
library_manifest: v3/windows_to_kylin/library/manifest.json
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: 3.16.5
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON
    -DENABLE_FOUNDATION=ON -DENABLE_NET=OFF -DENABLE_CRYPTO=OFF -DENABLE_NETSSL=OFF -DENABLE_JWT=OFF -DENABLE_DATA=OFF
    -DENABLE_MONGODB=OFF -DENABLE_REDIS=OFF -DENABLE_PROMETHEUS=OFF -DENABLE_ZIP=OFF -DENABLE_UTIL=OFF
    -DENABLE_XML=OFF -DENABLE_JSON=OFF -DENABLE_ENCODINGS=OFF -DENABLE_PAGECOMPILER=OFF -DENABLE_PAGECOMPILER_FILE2PAGE=OFF
    -DENABLE_ACTIVERECORD=OFF -DENABLE_ACTIVERECORD_COMPILER=OFF -DENABLE_CPPPARSER=OFF -DENABLE_POCODOC=OFF
    -DENABLE_APACHECONNECTOR=OFF -DENABLE_PDF=OFF -DENABLE_SEVENZIP=OFF -DENABLE_DATA_SQLITE=OFF -DENABLE_DATA_MYSQL=OFF
    -DENABLE_DATA_ODBC=OFF -DENABLE_DATA_POSTGRESQL=OFF && cmake --build {build} -j2
  artifact: '{build}/lib/libPocoFoundation.a'
gates:
  build: configure and build Foundation on the target platform
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile(?!Exception)|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - Foundation/src/RWLock_POSIX.cpp
    - Foundation/src/Semaphore_POSIX.cpp
  target_api: the rebuilt layer calls the target platform API rather than a hand-written portable fallback
  behavior: both primitives pass directly and through thread pools and timers, including timeout and interruption
  regression: filesystem and shared-library suites stay green
id: v2_rwlock_semaphore
level: L2
family_type: implicit_contract
sequence: 5
domain: runtime
difficulty: hard
title: Migrate the Foundation rwlock and semaphore primitives to Kylin V10 SP3
source:
  repo: https://github.com/pocoproject/poco.git
  commit: d6bd48a94c5f03e3c69cac1b024fdad5120e3a7b
  tag: poco-1.13.3-release
  license: BSL-1.0
  windows_files:
  - Foundation/src/RWLock_WIN32.cpp
  - Foundation/src/Semaphore_WIN32.cpp
  - Foundation/include/Poco/RWLock_WIN32.h
  - Foundation/include/Poco/Semaphore_WIN32.h
  gold_files:
  - Foundation/src/RWLock_POSIX.cpp
  - Foundation/src/Semaphore_POSIX.cpp
  test_files:
  - Foundation/testsuite/src/RWLockTest.cpp
  - Foundation/testsuite/src/SemaphoreTest.cpp
  - Foundation/testsuite/src/ThreadPoolTest.cpp
  - Foundation/testsuite/src/TimerTest.cpp
spec: |
  POCO Foundation is being moved from Windows to Kylin V10 SP3.  Neither
  the reader/writer lock nor the semaphore has a target-platform
  implementation yet.

  Port both, using the public headers, the existing callers and the
  Windows implementations as the reference.  Foundation must build with
  the repository CMake entry, and Poco::RWLock and Poco::Semaphore,
  together with the components built on them, must keep their documented
  external behavior.

  Scope: these two primitives only; do not change public headers or
  signatures.  Deliverable: `libPocoFoundation.a`, built by the repository
  CMake entry.

  Target environment: Kylin V10 SP3, x86_64, GCC 13.3, CMake 3.16.5, libm
  and the standard system threading library.
prepare:
  remove:
  - Foundation/src/RWLock_POSIX.cpp
  - Foundation/src/Semaphore_POSIX.cpp
hidden_tests:
  command: cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx RWLockTest SemaphoreTest
    ThreadPoolTest TimerTest
regression_tests:
  command: cd {build}/bin && ./Foundation-testrunner -ignore {work}/cppignore.lnx FileTest PathTest SharedLibraryTest
task_id: v2_rwlock_semaphore
