scenario: windows_to_kylin
task_family: v3
family: opencv_highgui
fit: B
counted: false
source_kind: upstream_platform_port
gold_kind: implementation
library_manifest: v3/windows_to_kylin/library/manifest.json
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: 3.16.5
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_LIST=core,imgproc,imgcodecs,highgui,ts
    -DWITH_GTK=ON -DWITH_QT=OFF -DBUILD_TESTS=ON -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_python3=OFF
    && cmake --build {build} -j2
  artifact: '{build}/lib/libopencv_highgui.a'
gates:
  build: configure and build highgui on the target platform
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - modules/highgui/src/window_gtk.cpp
  target_api: the rebuilt backend calls the platform windowing API rather than a hand-written window stub
  behavior: the highgui GUI tests pass under a virtual X server
  regression: the core, imgproc and imgcodecs suites stay green
id: l2_opencv_highgui
level: L2
family_type: pattern
sequence: 19
domain: gui
difficulty: medium
title: Migrate the OpenCV highgui backend to Kylin V10 SP3
source:
  repo: https://github.com/opencv/opencv.git
  commit: 71d3237a093b60a27601c20e9ee6c3e52154e8b1
  tag: 4.10.0
  license: Apache-2.0
  windows_files:
  - modules/highgui/src/window_w32.cpp
  gold_files:
  - modules/highgui/src/window_gtk.cpp
  test_files:
  - modules/highgui/test/test_gui.cpp
  - modules/highgui/test/test_main.cpp
spec: |
  OpenCV is being moved from Windows to Kylin V10 SP3.  The
  target-platform highgui backend has not been written yet.

  Reimplement the window backend behind the existing highgui
  interface: named windows, image display, key waiting, trackbars,
  mouse and keyboard callbacks, window resizing and destruction,
  and the window-handle and window-name queries.  The Win32 backend,
  the shared headers and the callers stay visible as the reference.

  Scope: the GUI backend only; do not change the public API or the
  build configuration.  Deliverable: `libopencv_highgui.a`, built
  by the repository CMake entry with the platform windowing backend
  enabled.

  Target environment: Kylin V10 SP3, x86_64, GCC 13.3, CMake
  3.16.5.
prepare:
  remove:
  - modules/highgui/src/window_gtk.cpp
hidden_tests:
  command: cd {build} && timeout 900 xvfb-run -a ./bin/opencv_test_highgui --gtest_filter=Highgui_GUI.*
task_id: l2_opencv_highgui
