id: synthetic_spawn_event_loop
level: L3
family_type: synthetic
sequence: 25
domain: process
difficulty: hard
title: Synthetic event-loop process spawn backend
source:
  repo: synthetic://windows-to-posix/event-loop-spawn
  commit: synthetic-1
  tag: n/a
  license: project-authored
  windows_files:
  - src/win32/spl_process_win32.c
  gold_files:
  - src/posix/spl_process_posix.c
  test_files:
  - tests/test_spl.c
spec: |
  A portable event-loop runtime is being moved from Windows to Kylin V10
  SP3.  The public process surface, the shared loop, the child probe helper
  and the public self-test are fixed.  Only the platform backend
  src/posix/spl_process_posix.c is missing; the Windows backend stays
  visible as the reference.

  The header documents the spawn, kill, close and loop contracts, including
  the stdio slot meanings and the exit callback.  The backend must reproduce
  the runtime's process semantics on the target with the platform's native
  process-creation primitive: stdio slot planning, environment and program
  lookup, the working directory, session handling for detached spawns, child
  signal state, child-side failure reporting, exit-status decoding and handle
  close/kill behaviour.  Where the Windows reference relies on Win32 handle
  semantics that POSIX does not share, follow the target's native conventions
  rather than transliterating the Windows calls; a failed spawn still leaves
  the caller's handle initialized, inactive and closable, and leaves no
  unreaped child behind.

  Implement src/posix/spl_process_posix.c.  Do not change the headers, the
  shared loop, the helper or the public self-test.
prepare:
  remove:
  - src/posix/spl_process_posix.c
harness:
  scripts:
  - spl_probe.sh
hidden_tests:
  command: bash {root}/harness/spl_probe.sh --build {build} --work {work}
task_id: synthetic_spawn_event_loop