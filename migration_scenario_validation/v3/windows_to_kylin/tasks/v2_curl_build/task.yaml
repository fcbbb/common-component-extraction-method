scenario: windows_to_kylin
task_family: v3
family: curl_build
fit: B
counted: true
source_kind: build_system_port
gold_kind: implementation
library_manifest: v3/windows_to_kylin/library/manifest.json
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: 3.16.5
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCURL_USE_OPENSSL=ON
    -DUSE_NGHTTP2=OFF -DCURL_USE_LIBPSL=OFF && cmake --build {build} -j2
  artifact: '{build}/src/curl'
gates:
  build: configure and build Foundation on the target platform
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: \b(CreateFile[AW]?|LoadLibrary[AW]?|RegOpenKey(?:Ex)?|CoCreateInstance|WSAStartup)\b
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - CMakeLists.txt
    - CMake
  target_api:
    source_dirs:
    - CMakeLists.txt
    - CMake
    source_regex: (?i)\b(?:cmake|configure|make)\b
    min_hits: 1
  behavior: the agent-authored build produces libcurl and the tool from this tree and a real TLS request
    succeeds
  regression: the produced tool reports its version and exits cleanly
id: v2_curl_build
level: L3
family_type: build_system
sequence: 13
domain: build-system
difficulty: hard
title: Migrate the curl build system to CMake on Kylin V10 SP3
source:
  repo: https://github.com/curl/curl.git
  commit: 7161cb17c01dcff1dc5bf89a18437d9d729f1ecd
  tag: curl-8_5_0
  license: curl
  windows_files:
  - projects/Windows/VC14.30/lib/libcurl.sln
  - winbuild/Makefile.vc
  gold_files:
  - CMakeLists.txt
  - CMake
  test_files:
  - tests/data/test3000
  - tests/data/test3001
spec: |
  curl is being moved from Windows to Kylin V10 SP3.  The top-level CMake
  build system has not been written yet; only the Windows project files
  and the nmake build remain.

  Produce a CMake build for Kylin that builds libcurl and the curl tool
  with the required TLS and compression support, generates the
  configuration header with the feature macros the sources expect, accepts
  the documented cache options, installs headers and libraries, and
  compiles entirely from this tree.  Do not vendor a prebuilt libcurl.

  Scope: the build system only; the library sources stay unchanged.
  Acceptance: the build succeeds with the documented options and the tool
  completes a TLS request against a local TLS server.
prepare:
  remove:
  - CMakeLists.txt
  - CMake
harness:
  scripts:
  - tls_probe.sh
hidden_tests:
  command: bash {root}/harness/tls_probe.sh --port 18444 --path {build}/src/curl
task_id: v2_curl_build
