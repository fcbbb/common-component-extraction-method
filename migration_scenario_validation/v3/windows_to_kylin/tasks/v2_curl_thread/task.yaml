    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|_beginthreadex|CreateThread|WaitForSingleObject|CloseHandle|EnterCriticalSection|LeaveCriticalSection|InitializeCriticalSection
    exclude_globs:
