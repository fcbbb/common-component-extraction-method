scenario: windows_to_kylin
task_family: v3
family: curl_tls
fit: B
counted: false
source_kind: upstream_platform_port
gold_kind: implementation
library_manifest: v3/windows_to_kylin/library/manifest.json
tolerances: {}
target:
  os: kylin-v10-sp3
  arch: x86_64
  toolchain: gcc-13.3
  cmake: 3.16.5
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCURL_USE_OPENSSL=ON
    -DUSE_NGHTTP2=OFF -DCURL_USE_LIBPSL=OFF -DBUILD_TESTING=ON -DBUILD_CURL_EXE=ON && cmake --build {build}
    -j2
  artifact: '{build}/src/curl'
gates:
  build: configure and build Foundation on the target platform
  api_removal:
    symbol_regex: ^(__imp_|CreateFileA|CreateFileW|ReadFile|WriteFile|WaitForSingleObject|WSAStartup|RegOpenKeyEx|RegCreateKeyEx|CoCreateInstance|LoadLibraryA|LoadLibraryW)
    source_regex: windows\.h|__declspec|_MSC_VER|#pragma comment|TCHAR\b|CreateFile(?!Exception)|WaitForSingleObject|RegOpenKey|CoCreateInstance
    exclude_globs:
    - '**/*_WIN32*'
    - '**/*_win32*'
    - '**/*w32*'
    - '**/*W32*'
    - '**/*_windows.c'
    - '**/*_windows.h'
    - '**/win32/**'
    - '**/Win32/**'
    - '**/win/**'
    - '**/Windows/**'
    - '**/windows/**'
    - '**/projects/Windows/**'
    - '**/winbuild/**'
    source_dirs:
    - lib/vtls/openssl.c
  target_api: the rebuilt layer calls the target platform API rather than a hand-written portable fallback
  behavior: curl builds and completes a real TLS request through the rebuilt backend
  regression: the tool still reports its version and exits cleanly
id: v2_curl_tls
level: L2
family_type: pattern
sequence: 12
domain: networking
difficulty: hard
title: Migrate the curl TLS backend to Kylin V10 SP3
source:
  repo: https://github.com/curl/curl.git
  commit: 7161cb17c01dcff1dc5bf89a18437d9d729f1ecd
  tag: curl-8_5_0
  license: curl
  windows_files:
  - lib/vtls/schannel.c
  - lib/vtls/schannel_verify.c
  - lib/vtls/schannel.h
  gold_files:
  - lib/vtls/openssl.c
  test_files:
  - tests/data/test3000
  - tests/data/test3001
spec: |
  curl is being moved from Windows to Kylin V10 SP3.  The target-platform
  TLS backend has not been written yet.

  Implement the backend behind curl's existing TLS abstraction: backend
  registration and version reporting, certificate and hostname
  verification, server name indication, ALPN, session reuse, blocking and
  non-blocking handshakes integrated with the transfer state machine
  (including would-block return codes), client certificates, revocation
  checks and public-key pinning.  The generic TLS interface, its callers,
  the Windows backend and the build entry stay visible as the reference.

  Scope: the TLS backend only; do not change the generic interface or
  call sites.  The library and tool must build with the repository build
  entry against the platform TLS library, and a real handshake against a
  local TLS server must succeed.
prepare:
  remove:
  - lib/vtls/openssl.c
harness:
  scripts:
  - tls_probe.sh
hidden_tests:
  command: bash {root}/harness/tls_probe.sh --port 18443 --path {build}/src/curl
task_id: v2_curl_tls
