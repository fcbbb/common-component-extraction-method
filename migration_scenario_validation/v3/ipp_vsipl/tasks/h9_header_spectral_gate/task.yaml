scenario: ipp_to_vsipl
task_family: v3
task_id: h9_header_spectral_gate
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13
level: L3
domain: radar
difficulty: hard
title: Header-only spectral gate ABI
source:
  repo: synthetic://header-spectral-gate-v1
  commit: synthetic-header-spectral-gate-v1
  license: synthetic
  vendored: true
  files:
  - include/spectral_gate.h
  - src/spectral_gate_internal.h
  - CMakeLists.txt
  gold_files:
  - plan_vsipl.c
  - window_vsipl.c
  - gate_vsipl.c
  - report_vsipl.c
  test_files:
  - test/public_test.c
  - harness/hidden_test.c
prepare:
  mode: vendored
  remove: []
library_manifest: v3/ipp_vsipl/library_generated/manifest.json
spec: |
  The implementation code is absent from this snapshot.  Implement the ABI
  in include/spectral_gate.h from the public test and the component library.
  The build must use VSIPL primitives.  The reference after state is gold/.
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2' 
  artifact: '{build}/libspectral_gate.a'
public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include -I"${VSIPL_ROOT}/include" {root}/harness/hidden_test.c {build}/libspectral_gate.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases:
  - asymmetric real frames, Hann window, natural one-sided magnitudes
  - causal trailing-mean gate and report
  - invalid frame lengths and null arguments
gates:
  build: must configure and build with no IPP include path
  api_removal: bash {root}/harness/check_api_removal.sh {build}/libspectral_gate.a
  target_api:
    symbol_regex: '^vsip_'
    source_dirs: ['src']
    source_regex: '\\bvsip_[A-Za-z0-9_]+\\b'
    min_hits: 1
  behavior: hidden_test exits 0
  numeric: hidden_test exits 0
tolerances:
  float32:
    rtol: 0.0002
    atol: 0.0
    mode: peak-relative
