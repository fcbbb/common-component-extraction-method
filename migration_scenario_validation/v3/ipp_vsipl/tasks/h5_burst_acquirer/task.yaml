scenario: ipp_to_vsipl
task_family: v3
task_id: h5_burst_acquirer
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
level: L3
domain: communications
difficulty: hard
title: Streaming burst acquirer with NCO, decimating FIR and lag profiles
library_manifest: v3/ipp_vsipl/library/manifest.json

source:
  repo: synthetic://burst-acq-v1
  commit: synthetic-burst-acq-v1
  license: synthetic
  vendored: true
  files:
    - src/state_ipp.c
    - src/pipeline_ipp.c
    - src/burst_acq_internal.h
    - include/burst_acq.h
    - CMakeLists.txt
  gold_files:
    - plan_vsipl.c
    - state_vsipl.c
    - pipeline_vsipl.c
  test_files:
    - test/public_test.c
    - harness/hidden_test.c

target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13

spec: |
  src/*.c implements a streaming complex burst acquirer on top of IPP.
  Migrate it to VSIPL while keeping include/burst_acq.h and the observable
  behaviour unchanged:

  - mixed[n] = input[n] * nco[n mod nco_len], with the NCO phase carried
    across ba_push calls;
  - M = decim*ntaps, and the decimating FIR is
    filt[j] = sum_{t=0}^{M-1} taps[t] * mixed[j*decim - t];
  - a center index is emitted only when it is at least M and divisible by
    decim; earlier centers have incomplete history and are not emitted;
  - the filtered samples are cut into consecutive nref-sample frames; each
    complete frame produces the lag-ordered correlation
    y[k] = sum_j z[j] * conj(ref[j-k]), k = -(nref-1)..(nref-1);
  - output index i stores y[i-(nref-1)]; out-of-range reference samples are
    zero;
  - nfft is a power of two and at least 2*nref-1; the forward transform is
    unscaled and the inverse applies exactly one 1/nfft factor;
  - ba_set_waveform copies every array and is only valid before the first
    input; ba_push carries NCO phase, FIR history and a partial decimated
    frame across calls;
  - ba_push writes exactly *nout profiles and returns -1 without consuming
    input when out_cap is too small;
  - the report aggregates all profiles written by the call: peak is a
    magnitude, energy is the sum of squared magnitudes, peak_index is the
    first concatenated lag index attaining the peak, and frames is *nout;
  - no ipps*/ippi* symbol may remain in the built artifact.

  The reference after state is gold/.

prepare:
  mode: vendored
  remove: []

build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libburst_acq.a'

public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
  note: 'rectangular NCO, impulse FIR and impulse reference smoke test'

hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include {root}/harness/hidden_test.c {build}/libburst_acq.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases:
    - asymmetric complex NCO, FIR taps and reference against direct reference
    - same stream split into irregular blocks gives identical lag profiles
    - first valid FIR center and decimated frame carry
    - out_cap too small rejects without consuming input
    - waveform replacement after input is rejected
    - empty push and invalid configuration
    - report peak, energy, index and frame count

tolerances:
  float32:
    rtol: 3.0e-4
    atol: 0.0
    mode: peak-relative

gates:
  build: 'must configure and build with no IPP include path'
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libburst_acq.a'
  target_api:
    symbol_regex: '^vsip_'
    source_dirs: ['src']
    source_regex: '\\bvsip_[A-Za-z0-9_]+\\b'
    min_hits: 1
  behavior: 'hidden_test exits 0'
  numeric: 'hidden_test exits 0'