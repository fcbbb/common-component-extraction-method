scenario: ipp_to_vsipl
task_family: v3
task_id: s1_radar_correlation
role: library_source
fit: B
counted: false
source_kind: synthetic
gold_kind: implementation
gold_map:
  plan_vsipl.c: src/plan_ipp.c
  matched_filter_vsipl.c: src/matched_filter_ipp.c
  correlate_vsipl.c: src/correlate_ipp.c
  profile_vsipl.c: src/profile_ipp.c
target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13
level: L3
domain: radar
difficulty: hard
title: Radar pulse-compression correlation — library source
source:
  repo: synthetic://radar-correlation-v1
  commit: synthetic-radar-correlation-v1
  license: synthetic
  vendored: true
  files:
  - src/plan_ipp.c
  - src/matched_filter_ipp.c
  - src/correlate_ipp.c
  - src/profile_ipp.c
  - src/radar_pipeline_internal.h
  - include/radar_pipeline.h
  - CMakeLists.txt
  gold_files:
  - plan_vsipl.c
  - matched_filter_vsipl.c
  - correlate_vsipl.c
  - profile_vsipl.c
  test_files:
  - test/public_test.c
  - harness/hidden_test.c
prepare:
  mode: vendored
  remove: []
library_manifest: v3/ipp_vsipl/library_generated/manifest.json
spec: Implement the radar correlation layer against VSIPL while preserving the split-complex
  API, the lag order, the 2*N-1 output length, the report fields and the error contract.
  The reference after state is gold/.
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}"
    -DBUILD_HIDDEN_TESTS=ON && cmake --build {build} -j2
  artifact: '{build}/libradar_correlation.a'
public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
hidden_tests:
  command: '{build}/hidden_test'
  visible_to_agent: false
  cases:
  - hidden_test.cpp
gates:
  build: must configure and build with no IPP include path
  api_removal: bash {root}/harness/check_api_removal.sh {build}/libradar_correlation.a
  behavior: hidden_test exits 0
  numeric: hidden_test exits 0
tolerances:
  float32:
    rtol: 0.0002
    atol: 0.0
    mode: peak-relative
