scenario: ipp_to_vsipl
task_family: v3
task_id: h14_norm_corr
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
level: L2
domain: radar
difficulty: medium
title: Normalized real lag correlation
library_manifest: v3/ipp_vsipl/library/manifest.json
source:
  repo: synthetic://norm-corr-v1
  commit: synthetic-norm-corr-v1
  license: synthetic
  vendored: true
  files: [src/norm_corr_ipp.c, include/norm_corr.h, CMakeLists.txt]
  gold_files: [norm_corr_vsipl.c]
  test_files: [test/public_test.c, harness/hidden_test.c]
target: {api: VSIPL, library: jvsip, toolchain: gcc-13}
spec: |
  Migrate norm_corr_ipp.c to VSIPL. Preserve the normalized lag correlation,
  lag range, peak and first peak lag in include/norm_corr.h. Reference gold/.
prepare: {mode: vendored, remove: []}
build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libnorm_corr.a'
public_tests: {command: '{build}/public_test', visible_to_agent: true}
hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include -I"${VSIPL_ROOT}/include" {root}/harness/hidden_test.c {build}/libnorm_corr.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases: [normalized lag values, peak lag, null arguments]
tolerances: {float32: {rtol: 3.0e-4, atol: 0.0, mode: peak-relative}}
gates:
  build: 'no IPP include path'
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libnorm_corr.a'
  target_api: {symbol_regex: '^vsip_', source_dirs: ['src'], source_regex: '\\bvsip_[A-Za-z0-9_]+\\b', min_hits: 1}
  behavior: 'hidden_test exits 0'
  numeric: 'hidden_test exits 0'
