scenario: ipp_to_vsipl
task_family: v3
task_id: h10_header_corr2
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
level: L2
domain: sonar
difficulty: hard
title: Header-only correlation ABI
library_manifest: v3/ipp_vsipl/library/manifest.json

source:
  repo: synthetic://header-corr2-v1
  commit: synthetic-header-corr2-v1
  license: synthetic
  vendored: true
  files:
    - include/sonar_lag.h
    - src/sonar_lag_internal.h
    - CMakeLists.txt
  gold_files:
    - plan_vsipl.c
    - reference_vsipl.c
    - correlate_vsipl.c
    - report_vsipl.c
  test_files:
    - test/public_test.c
    - harness/hidden_test.c

target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13

spec: |
  The implementation code is absent from this snapshot.  Implement the ABI
  in include/sonar_lag.h from the public test and the component library.
  The build must use VSIPL primitives.  The reference after state is gold/.

prepare:
  mode: vendored
  remove: []

build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libsonar_lag.a'

public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
  note: 'real reference impulse at index 3: out[i] = in[i-4] on the valid lags'

hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include -I"${VSIPL_ROOT}/include" {root}/harness/hidden_test.c {build}/libsonar_lag.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases:
    - complex asymmetric reference and frame against O(N^2) reference
    - reference-copy isolation
    - unit-DC amplitude (N, N-1, ... triangle)
    - oversized nfft must not change the lags
    - zero frame followed by a non-zero frame must not contaminate output
    - equal peak magnitudes must report the first output index
    - invalid configuration and null arguments

tolerances:
  float32:
    rtol: 2.0e-4
    atol: 0.0
    mode: peak-relative

gates:
  build: 'must configure and build with no IPP include path'
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libsonar_lag.a'
  target_api:
    symbol_regex: '^vsip_'
    source_dirs: ['src']
    source_regex: '\\bvsip_[A-Za-z0-9_]+\\b'
    min_hits: 1
  behavior: 'hidden_test exits 0'
  numeric: 'hidden_test exits 0'