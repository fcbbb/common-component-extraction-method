scenario: ipp_to_vsipl
task_family: v3
task_id: s3_channelizer
role: library_source
fit: B
counted: false
source_kind: synthetic
gold_kind: implementation
gold_map:
  state_vsipl.c: src/state_ipp.c
  mixer_vsipl.c: src/mixer_ipp.c
  fir_vsipl.c: src/fir_ipp.c
  stats_vsipl.c: src/stats_ipp.c
target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13
level: L3
domain: communications
difficulty: hard
title: Streaming wideband channelizer — library source
source:
  repo: synthetic://channelizer-v1
  commit: synthetic-channelizer-v1
  license: synthetic
  vendored: true
  files:
  - src/state_ipp.c
  - src/mixer_ipp.c
  - src/fir_ipp.c
  - src/stats_ipp.c
  - src/channelizer_internal.h
  - include/channelizer.h
  - CMakeLists.txt
  gold_files:
  - state_vsipl.c
  - mixer_vsipl.c
  - fir_vsipl.c
  - stats_vsipl.c
  test_files:
  - test/public_test.c
  - harness/hidden_test.c
prepare:
  mode: vendored
  remove: []
library_manifest: v3/ipp_vsipl/library_generated/manifest.json
spec: Implement the streaming channelizer against VSIPL while preserving NCO phase
  continuity, decimating FIR history, block-size invariance, report fields and error
  contract. The reference after state is gold/.
build:
  command: cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}"
    -DBUILD_HIDDEN_TESTS=ON && cmake --build {build} -j2
  artifact: '{build}/libchannelizer.a'
public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
hidden_tests:
  command: '{build}/hidden_test'
  visible_to_agent: false
  cases:
  - hidden_test.cpp
gates:
  build: must configure and build with no IPP include path
  api_removal: bash {root}/harness/check_api_removal.sh {build}/libchannelizer.a
  behavior: hidden_test exits 0
  numeric: hidden_test exits 0
tolerances:
  float32:
    rtol: 0.0002
    atol: 0.0
    mode: peak-relative
