scenario: ipp_to_vsipl
task_family: v3
task_id: h2_sonar_lag
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
level: L2
domain: sonar
difficulty: hard
title: Passive-sonar complex lag profile
library_manifest: v3/ipp_vsipl/library/manifest.json

source:
  repo: synthetic://sonar-lag-v1
  commit: synthetic-sonar-lag-v1
  license: synthetic
  vendored: true
  files:
    - src/plan_ipp.c
    - src/reference_ipp.c
    - src/correlate_ipp.c
    - src/report_ipp.c
    - src/sonar_lag_internal.h
    - include/sonar_lag.h
    - CMakeLists.txt
  gold_files:
    - plan_vsipl.c
    - reference_vsipl.c
    - correlate_vsipl.c
    - report_vsipl.c
  test_files:
    - test/public_test.c
    - harness/hidden_test.c

target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13

spec: |
  src/*.c implements a complex passive-sonar lag profile on top of IPP.
  Migrate it to VSIPL while keeping include/sonar_lag.h and the observable
  behaviour unchanged:

  - y[k] = sum_j x[j] * conj(ref[j-k]) for k = -(nref-1)..(nref-1);
    out[i] is y[i-(nref-1)], so the most negative lag is output index 0;
  - out-of-range reference samples are zero;
  - nfft is caller chosen, a power of two, and at least 2*nref-1;
  - the forward transform is unscaled and the inverse applies exactly one
    1/nfft factor;
  - sl_set_reference copies the reference, and sl_process always writes exactly
    2*nref-1 complex lags into caller-owned split planes;
  - the report peak is a magnitude, energy is the sum of squared magnitudes,
    and peak_index is the first output index attaining the peak;
  - no ipps*/ippi* symbol may remain in the built artifact.

  The reference after state is gold/.

prepare:
  mode: vendored
  remove: []

build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libsonar_lag.a'

public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
  note: 'real reference impulse at index 3: out[i] = in[i-4] on the valid lags'

hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include {root}/harness/hidden_test.c {build}/libsonar_lag.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases:
    - complex asymmetric reference and frame against O(N^2) reference
    - reference-copy isolation
    - unit-DC amplitude (N, N-1, ... triangle)
    - oversized nfft must not change the lags
    - zero frame followed by a non-zero frame must not contaminate output
    - equal peak magnitudes must report the first output index
    - invalid configuration and null arguments

tolerances:
  float32:
    rtol: 2.0e-4
    atol: 0.0
    mode: peak-relative

gates:
  build: 'must configure and build with no IPP include path'
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libsonar_lag.a'
  target_api:
    symbol_regex: '^vsip_'
    source_dirs: ['src']
    source_regex: '\\bvsip_[A-Za-z0-9_]+\\b'
    min_hits: 1
  behavior: 'hidden_test exits 0'
  numeric: 'hidden_test exits 0'