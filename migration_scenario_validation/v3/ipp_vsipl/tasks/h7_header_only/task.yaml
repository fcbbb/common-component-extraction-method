scenario: ipp_to_vsipl
task_family: v3
task_id: h7_header_only
role: held_out
counted: true
source_kind: synthetic
gold_kind: implementation
level: L3
domain: communications
difficulty: hard
title: Header-only streaming burst acquirer
library_manifest: v3/ipp_vsipl/library/manifest.json

source:
  repo: synthetic://burst-header-only-v1
  commit: synthetic-burst-header-only-v1
  license: synthetic
  vendored: true
  files:
    - include/burst_acq.h
    - src/burst_acq_internal.h
    - CMakeLists.txt
  gold_files:
    - plan_vsipl.c
    - state_vsipl.c
    - pipeline_vsipl.c
  test_files:
    - test/public_test.c
    - harness/hidden_test.c

target:
  api: VSIPL
  library: jvsip
  toolchain: gcc-13

spec: |
  The implementation code is intentionally not present in this snapshot.
  Implement the ABI in include/burst_acq.h from the public test and the
  component library.  The implementation must call VSIPL primitives; the
  built artifact is checked for VSIPL symbols.  The reference after state is
  gold/.

prepare:
  mode: vendored
  remove: []

build:
  command: 'cmake -S . -B {build} -DCMAKE_BUILD_TYPE=Release -DVSIPL_ROOT="${VSIPL_ROOT:-}" && cmake --build {build} -j2'
  artifact: '{build}/libburst_acq.a'

public_tests:
  command: '{build}/public_test'
  visible_to_agent: true
  note: 'rectangular NCO, impulse FIR and impulse reference smoke test'

hidden_tests:
  command: 'cc -std=c99 -O2 -I{work}/include -I{root}/include -I"${VSIPL_ROOT}/include" {root}/harness/hidden_test.c {build}/libburst_acq.a "${VSIPL_ROOT}/lib/libvsip.a" -lm -o {build}/hidden_test && {build}/hidden_test'
  visible_to_agent: false
  cases:
    - asymmetric complex NCO, FIR taps and reference against direct reference
    - same stream split into irregular blocks gives identical lag profiles
    - first valid FIR center and decimated frame carry
    - invalid configuration, including a non-power-of-two nfft

tolerances:
  float32:
    rtol: 3.0e-4
    atol: 0.0
    mode: peak-relative

gates:
  build: 'must configure and build with no IPP include path'
  api_removal: 'bash {root}/harness/check_api_removal.sh {build}/libburst_acq.a'
  target_api:
    symbol_regex: '^vsip_'
    source_dirs: ['src']
    source_regex: '\\bvsip_[A-Za-z0-9_]+\\b'
    min_hits: 1
  behavior: 'hidden_test exits 0'
  numeric: 'hidden_test exits 0'