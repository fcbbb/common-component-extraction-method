# Component Method headless profile overlay for a host execution plane.
#
# Same stage prompt and output contract as `component-method-extraction`, but
# the agent's shell is the stock `bash` tool running in the DSH process's own
# environment instead of `controlled-bash` over the Docker API.  The component
# runner selects this profile when `COMPONENT_DSH_STAGE_RUNTIME=host`: the
# stage executes on the machine that owns the workspace, so there is no
# container to reach through a socket and no `/testbed` bind mount.

- id: agent-default-model
  config:
    provider: component-method
    model: !!js process.env.COMPONENT_DSH_MODEL

- id: llm-pi-ai
  config:
    providers:
      component-method:
        displayName: Component Method Route
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        timeoutMs: !!js Number(process.env.COMPONENT_DSH_REQUEST_TIMEOUT_MS)
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.COMPONENT_DSH_MAX_RETRIES)
        compat: !!js JSON.parse(process.env.COMPONENT_DSH_COMPAT_JSON || '{}')
        models:
          - id: !!js process.env.COMPONENT_DSH_MODEL
            contextWindow: !!js Number(process.env.COMPONENT_DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.COMPONENT_DSH_MAX_OUTPUT_TOKENS)
            reasoningEfforts: false

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: session-title-llm
  disabled: true

- id: user-questions
  disabled: true

- id: system-prompt
  config:
    personaPrefix: !!js process.env.COMPONENT_DSH_SYSTEM_PROMPT

- id: agent-instructions
  disabled: true

- id: tool-working-directory
  disabled: true

# Headless and unattended: no interactive answerer exists, so the shell runs
# without asking.  The stage workspace is the host directory named by
# COMPONENT_DSH_DEFAULT_CWD.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.COMPONENT_DSH_DEFAULT_CWD || '/testbed'

- id: approval
  config:
    policy: never

- id: permission
  disabled: true

# The host shell: keep the stock bash tool and its executor.
- id: bash-sandbox
  disabled: false

- id: shell-env
  disabled: false

- id: tool-bash
  disabled: false

- insert:
    - id: component-method-agent-runtime
      name: '@component-method/dsh-agent-runtime'

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
