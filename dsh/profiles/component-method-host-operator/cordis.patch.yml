# Component Method headless profile overlay (method arm) for a host-side
# execution plane.  The shell is the ordinary `bash` tool in the DSH process's
# own environment because the host has no Docker socket.  The method surface is
# the same single entry as `component-method-migration`: `component_run_stage`
# plus the built-in job tools; per-stage plugins are not mounted.

- id: agent-default-model
  config:
    provider: component-method
    model: !!js process.env.COMPONENT_DSH_MODEL

- id: llm-pi-ai
  config:
    providers:
      component-method:
        displayName: Component Method Route
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        timeoutMs: !!js Number(process.env.COMPONENT_DSH_REQUEST_TIMEOUT_MS)
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.COMPONENT_DSH_MAX_RETRIES)
        compat: !!js JSON.parse(process.env.COMPONENT_DSH_COMPAT_JSON || '{}')
        models:
          - id: !!js process.env.COMPONENT_DSH_MODEL
            contextWindow: !!js Number(process.env.COMPONENT_DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.COMPONENT_DSH_MAX_OUTPUT_TOKENS)
            reasoningEfforts: false

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: session-title-llm
  disabled: true

- id: user-questions
  disabled: true

- id: system-prompt
  config:
    personaPrefix: !!js process.env.COMPONENT_DSH_SYSTEM_PROMPT

- id: agent-instructions
  disabled: true

- id: tool-working-directory
  disabled: true

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.COMPONENT_DSH_DEFAULT_CWD || '/workspace'

- id: approval
  config:
    policy: never

- id: permission
  disabled: true

- id: bash-sandbox
  disabled: false

- id: shell-env
  disabled: false

- id: tool-bash
  disabled: false

- insert:
    # One method entry for the whole workflow.  Workspace preparation is done
    # by the harness adapter, so `component-method-ops` is not mounted either.
    - id: component-method-orchestrator
      name: '@component-method/dsh-method-orchestrator'

- id: tool-pwsh
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: plan-mode
  disabled: true

- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
