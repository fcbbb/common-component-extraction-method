# Component Method headless profile overlay for a host-side execution plane.
#
# Same model route and prompt wiring as `component-method`, but the agent's
# shell is the ordinary `bash` tool running in the DSH process's own
# environment instead of `controlled-bash` over a Docker socket.  Use it when
# DSH itself runs on the machine that must execute the commands (a task
# container, or a remote host that has the target toolchain and no Docker
# daemon).

- id: agent-default-model
  config:
    provider: component-method
    model: !!js process.env.COMPONENT_DSH_MODEL

- id: llm-pi-ai
  config:
    providers:
      component-method:
        displayName: Component Method Route
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        timeoutMs: !!js Number(process.env.COMPONENT_DSH_REQUEST_TIMEOUT_MS)
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.COMPONENT_DSH_MAX_RETRIES)
        compat: !!js JSON.parse(process.env.COMPONENT_DSH_COMPAT_JSON || '{}')
        models:
          - id: !!js process.env.COMPONENT_DSH_MODEL
            contextWindow: !!js Number(process.env.COMPONENT_DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.COMPONENT_DSH_MAX_OUTPUT_TOKENS)
            reasoningEfforts: false

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: session-title-llm
  disabled: true

- id: user-questions
  disabled: true

- id: system-prompt
  config:
    personaPrefix: !!js process.env.COMPONENT_DSH_SYSTEM_PROMPT

- id: agent-instructions
  disabled: true

- id: tool-working-directory
  disabled: true

# Headless, unattended: no interactive answerer exists, so an `ask` policy
# would fail closed and block every command.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.COMPONENT_DSH_DEFAULT_CWD || '/workspace'

- id: approval
  config:
    policy: never

- id: permission
  disabled: true

# The host shell: keep the stock bash tool and its executor.
- id: bash-sandbox
  disabled: false

- id: shell-env
  disabled: false

- id: tool-bash
  disabled: false

- id: tool-pwsh
