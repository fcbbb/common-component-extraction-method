# Component Method headless profile overlay.
# All variable values are supplied by the Python controller in a minimal process
# environment. The model sees only the controlled_bash tool registered below.

- id: agent-default-model
  config:
    provider: component-method
    model: !!js process.env.COMPONENT_DSH_MODEL

- id: llm-pi-ai
  config:
    providers:
      component-method:
        displayName: Component Method Route
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL
        timeoutMs: !!js Number(process.env.COMPONENT_DSH_REQUEST_TIMEOUT_MS)
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.COMPONENT_DSH_MAX_RETRIES)
        compat: !!js JSON.parse(process.env.COMPONENT_DSH_COMPAT_JSON || '{}')
        models:
          - id: !!js process.env.COMPONENT_DSH_MODEL
            contextWindow: !!js Number(process.env.COMPONENT_DSH_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.COMPONENT_DSH_MAX_OUTPUT_TOKENS)
            reasoningEfforts: false

